<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),main=$('main');
  let boot,working=false,dirty=false,currentPage='filters',query='',status='',offset=0,preview=null,pendingApplyRunId='';
  const names={Status:'状態',NameOrNote:'メモ・名前',From:'送信元',To:'宛先',Subject:'件名',Query:'含む条件',NegatedQuery:'含まない条件',HasAttachment:'添付ファイルあり',ExcludeChats:'チャットを除外',SizeBytes:'サイズ（バイト）',SizeComparison:'サイズの比較',UserLabel:'ラベル',Archive:'受信トレイをスキップ',MarkRead:'既読にする',NeverSpam:'迷惑メールにしない',MarkImportant:'常に重要マークを付ける',NeverImportant:'重要マークを付けない',Star:'スターを付ける',MoveToTrash:'ゴミ箱に移動',ForwardTo:'転送先',AdditionalAddLabelIds:'追加するラベルID',AdditionalRemoveLabelIds:'除外するラベルID'};
  const operations={CREATE:'追加',REPLACE:'更新',DELETE:'削除',NOOP:'変更なし',ERROR:'入力エラー',REMOTE_ONLY:'Gmail側のみ'};
  const commands={IMPORT:'取り込み',PREVIEW:'変更確認',APPLY:'Gmailへ反映',VERIFY:'整合性確認',RECOVER:'復旧',WEB_SAVE:'編集を保存'};
  function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined&&text!==null)el.textContent=String(text);if(cls)el.className=cls;return el;}
  function add(parent,...children){children.filter(Boolean).forEach(child=>parent.append(child));return parent;}
  function button(text,fn,style='secondary'){const b=node('button',text,'button '+style);b.type='button';b.addEventListener('click',action(fn));return b;}
  function clearMessage(){for(const id of ['notice','error']){$(id).hidden=true;$(id).replaceChildren();}}
  function message(text,type='success'){const e=type==='error'?$('error'):$('notice');e.replaceChildren(node('p',text));e.hidden=false;e.className='notice '+(type==='error'?'error':type==='warning'?'warning':type==='info'?'info':'');if(type==='error')e.focus();}
  function action(fn){return async function(event){if(working)return;working=true;clearMessage();$('busy').hidden=false;main.setAttribute('aria-busy','true');const controls=[...document.querySelectorAll('button,input,select,textarea')].map(el=>[el,el.disabled]);controls.forEach(([el])=>el.disabled=true);try{await fn(event);}catch(err){if(pendingApplyRunId)showUnknown(pendingApplyRunId,err);else message((err&&err.message)||'通信に失敗しました。履歴を確認してから再操作してください。','error');}finally{working=false;$('busy').hidden=true;main.removeAttribute('aria-busy');controls.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled;});}};}
  function rpc(command,input={}){if(window.GFM_LOCAL)return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,input})}).then(r=>r.json()).then(r=>{if(r.error)throw new Error(r.error);return r.data;});return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).GFM_web(command,input));}
  function shell(title,lead,page){main.replaceChildren(node('h1',title),node('p',lead,'lead'));if(page)currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===currentPage)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.focus();window.scrollTo(0,0);}
  function canLeave(){return !dirty||window.confirm('保存していない変更があります。変更を破棄して移動しますか？');}
  function pager(parent,total,start,load){if(total<=20)return;const p=node('div',null,'pagination');if(start>0)p.append(button('前の20件',()=>load(start-20)));p.append(node('span',(start+1)+'〜'+Math.min(start+20,total)+' / '+total+'件','count'));if(start+20<total)p.append(button('次の20件',()=>load(start+20)));parent.append(p);}
  function titleOf(r){return r.NameOrNote||r.From||r.Subject||r.Query||r.To||'条件未入力のフィルター';}
  function stateTag(value){return node('span',value,'tag '+(value==='有効'?'active':value==='削除予定'?'delete':''));}
  async function list(start=0){offset=start;dirty=false;const r=await rpc('list',{query,status,offset});shell('フィルター','条件を編集して保存し、変更内容を確認してからGmailへ反映します。','filters');
    const actions=node('div',null,'actions');add(actions,button('＋ 新規フィルター',async()=>edit(await rpc('new')),''),button('Gmailから取り込む',importCheck));main.append(actions);
    const form=node('form',null,'search-panel'),grid=node('div',null,'search-grid');const search=field('search','キーワード','input',query,'送信元・件名・条件・メモ・ラベルを検索');search.control.type='search';const select=field('status-filter','状態','select',status,null,[['','すべて'],['有効','有効'],['無効','無効'],['削除予定','削除予定']]);
    const submit=node('button','検索','button secondary');submit.type='submit';add(grid,search.wrap,select.wrap,submit);form.append(grid);form.addEventListener('submit',action(async e=>{e.preventDefault();query=search.control.value;status=select.control.value;await list();}));main.append(form,node('p',r.total+'件を表示対象にしています（全'+r.allTotal+'件）','count'));
    const cards=node('div',null,'filter-list');for(const item of r.items){const card=node('article',null,'filter-card'),head=node('div',null,'card-head'),title=node('button',titleOf(item),'title-button');title.type='button';title.addEventListener('click',action(async()=>edit(await rpc('detail',{key:item.RuleKey}))));add(head,title,stateTag(item.Status));card.append(head);
      const desc=[item.From&&'送信元: '+item.From,item.To&&'宛先: '+item.To,item.Subject&&'件名: '+item.Subject,item.Query&&'条件: '+item.Query].filter(Boolean).join(' / ');card.append(node('p',desc||'詳細を開いて条件を確認してください。','card-description muted'));const tags=node('div',null,'tags');if(item.UserLabel)tags.append(node('span',item.UserLabel,'tag'));if(item.unsynced)tags.append(node('span','未反映','tag pending'));if(item.Result)tags.append(node('small',item.Result));card.append(tags);cards.append(card);}
    if(!r.items.length)cards.append(node('div',query||status?'条件に一致するフィルターはありません。':'フィルターはまだありません。Gmailから取り込むか、新規作成してください。','empty'));main.append(cards);pager(main,r.total,offset,list);
  }
  function field(id,label,kind,value,hint,choices){const wrap=node('div',null,'field'),l=node('label',label);l.htmlFor=id;wrap.append(l);if(hint){const h=node('span',hint,'hint');h.id=id+'-hint';wrap.append(h);}const control=node(kind==='textarea'?'textarea':kind==='select'?'select':'input');control.id=id;control.name=id;if(hint)control.setAttribute('aria-describedby',id+'-hint');if(kind==='select')for(const [v,t]of choices){const option=node('option',t);option.value=v;control.append(option);}else if(kind!=='textarea')control.type='text';control.value=value===undefined||value===null?'':String(value);wrap.append(control);return {wrap,control};}
  function normalizedBool(v){if(v===true||String(v).toUpperCase()==='TRUE')return 'TRUE';if(v===false||String(v).toUpperCase()==='FALSE')return 'FALSE';return '';}
  function edit(detail){dirty=false;const row=detail.row;shell(detail.isNew?'新規フィルター':'フィルターを編集','ここでの保存はGmailに反映されません。保存後に「変更確認」へ進んでください。','filters');main.append(button('一覧へ戻る',async()=>{if(canLeave())await list(offset);},'tertiary'));
    const form=node('form'),controls={},errors=node('div',null,'notice error');errors.hidden=true;errors.setAttribute('role','alert');errors.tabIndex=-1;form.append(errors);
    const groups=[['基本設定',['NameOrNote','Status']],['メールの条件',['From','To','Subject','Query','NegatedQuery','HasAttachment','ExcludeChats','SizeComparison','SizeBytes']],['処理内容',['UserLabel','Archive','MarkRead','NeverSpam','MarkImportant','NeverImportant','Star','MoveToTrash','ForwardTo']]];
    const flags=['Archive','MarkRead','NeverSpam','MarkImportant','NeverImportant','Star','MoveToTrash'];
    const hints={Status:'「無効」「削除予定」は、反映時にGmailのフィルターを削除します。',Query:'Gmailの検索式を入力できます。例: has:attachment',NegatedQuery:'一致させたくない検索式を入力します。',SizeBytes:'0〜2147483647の整数。サイズの比較と一緒に指定してください。',MoveToTrash:'一致したメールをゴミ箱に移動する設定です。反映前に確認が表示されます。',ForwardTo:'Gmailで検証済みの転送先だけを選べます。',UserLabel:'既存のラベルを選択します。',AdditionalAddLabelIds:'ラベルIDのJSON配列。例: ["Label_1"]。通常は変更不要です。',AdditionalRemoveLabelIds:'ラベルIDのJSON配列。専用項目で設定できるラベルはそちらを使ってください。'};
    function make(k,parent){let choices,kind='input',value=row[k];if(k==='Status')choices=[['有効','有効'],['無効','無効'],['削除予定','削除予定']];if(k==='SizeComparison')choices=[['','指定なし'],['larger','より大きい'],['smaller','より小さい'],['unspecified','比較方法を指定しない']];if(['HasAttachment','ExcludeChats'].includes(k)){choices=[['','指定なし'],['TRUE','はい'],['FALSE','いいえ']];value=normalizedBool(value);}if(flags.includes(k)){choices=[['FALSE','しない'],['TRUE','する']];value=normalizedBool(value)||'FALSE';}if(k==='UserLabel')choices=[['','付けない'],...boot.labels.filter(l=>l.type==='user').map(l=>[l.name,l.name])];if(k==='ForwardTo')choices=[['','転送しない'],...boot.forwarding.map(f=>[f.forwardingEmail,f.forwardingEmail])];if(choices&&value&&!choices.some(c=>c[0]===value))choices.push([value,value+'（現在は利用できません）']);if(choices)kind='select';else if(['Query','NegatedQuery','AdditionalAddLabelIds','AdditionalRemoveLabelIds'].includes(k))kind='textarea';const f=field(k,names[k],kind,value,hints[k],choices);if(k==='SizeBytes')f.control.inputMode='numeric';controls[k]=f;parent.append(f.wrap);}
    for(const [label,keys]of groups){const group=node('fieldset',null,'form-section');group.append(node('legend',label));keys.forEach(k=>make(k,group));form.append(group);}const advanced=node('details',null,'details'),advancedContent=node('div');advanced.append(node('summary','詳細設定'));['AdditionalAddLabelIds','AdditionalRemoveLabelIds'].forEach(k=>make(k,advancedContent));advanced.append(advancedContent);form.append(advanced);
    form.addEventListener('input',()=>{dirty=true;});form.addEventListener('change',()=>{dirty=true;});const actions=node('div',null,'form-actions'),save=node('button','変更を保存','button');save.type='submit';add(actions,save,button('変更内容を確認',async()=>{if(canLeave()){dirty=false;await showPreview();}}));form.append(actions);
    form.addEventListener('submit',action(async e=>{e.preventDefault();errors.hidden=true;for(const f of Object.values(controls)){f.control.removeAttribute('aria-invalid');const old=f.wrap.querySelector('.field-error');if(old)old.remove();}const patch=Object.fromEntries(Object.entries(controls).map(([k,f])=>[k,f.control.value]));let invalid=[];if(patch.SizeBytes!==''&&(!/^\d+$/.test(patch.SizeBytes)||Number(patch.SizeBytes)>2147483647))invalid.push(['SizeBytes','0〜2147483647の整数を入力してください。']);for(const k of ['AdditionalAddLabelIds','AdditionalRemoveLabelIds'])if(patch[k]){try{const v=JSON.parse(patch[k]);if(!Array.isArray(v)||v.some(x=>typeof x!=='string'||!x))throw new Error();}catch(_){invalid.push([k,'ラベルIDの文字列配列を入力してください。例: ["Label_1"]']);}}if(invalid.length){errors.replaceChildren(node('p',invalid.length+'項目の入力を確認してください。'));for(const [k,text]of invalid){const f=controls[k];f.control.setAttribute('aria-invalid','true');const err=node('p',text,'field-error');err.id=k+'-error';f.control.setAttribute('aria-describedby',k+'-error');f.wrap.append(err);if(f.wrap.closest('details'))f.wrap.closest('details').open=true;}errors.hidden=false;errors.focus();return;}const result=await rpc('save',{key:row.RuleKey,version:detail.version,patch});dirty=false;preview=null;edit(result);message(result.warnings.length?'保存しました。反映前に修正が必要です: '+result.warnings.join(' / '):'変更を保存しました。Gmailへの反映は「変更確認」から実行してください。',result.warnings.length?'warning':'success');}));main.append(form);
  }
  async function importCheck(){const check=await rpc('importCheck');shell('Gmailから取り込む','Gmailの設定は変更せず、スプシに未登録のフィルターを追加します。','filters');main.append(node('div','Gmail全'+check.total+'件のうち、未登録'+check.count+'件を追加します。既存の編集内容は維持します。','notice info'));const a=node('div',null,'actions');add(a,button(check.count+'件を取り込む',async()=>{const r=await rpc('import',{token:check.token});preview=null;await list();message(r.count+'件を追加しました。全'+r.total+'件の取り込みを確認しました。');},''),button('戻る',()=>list(offset)));main.append(a);}
  function stats(summary){const grid=node('div',null,'summary-grid');for(const k of ['CREATE','REPLACE','DELETE']){const box=node('div',null,'stat');add(box,node('strong',summary[k]||0),node('span',operations[k]));grid.append(box);}return grid;}
  function filterDefinition(filter){const dl=node('dl',null,'definition');if(!filter){dl.append(node('dd','設定なし'));return dl;}const systemLabels={INBOX:'受信トレイ',UNREAD:'未読',SPAM:'迷惑メール',IMPORTANT:'重要',STARRED:'スター',TRASH:'ゴミ箱'};const labels=ids=>ids.map(id=>{const l=boot.labels.find(l=>l.id===id);return systemLabels[id]||(l?l.name:id);}).join('、');const c=filter.criteria||{},a=filter.action||{},pairs=[];const mapped={from:'送信元',to:'宛先',subject:'件名',query:'含む条件',negatedQuery:'含まない条件',hasAttachment:'添付ファイルあり',excludeChats:'チャットを除外',size:'サイズ（バイト）',sizeComparison:'サイズの比較'};for(const [k,v]of Object.entries(c))pairs.push([mapped[k]||k,typeof v==='boolean'?(v?'はい':'いいえ'):k==='sizeComparison'?({larger:'より大きい',smaller:'より小さい',unspecified:'比較方法を指定しない'}[v]||v):v]);if(a.addLabelIds?.length)pairs.push(['付けるラベル',labels(a.addLabelIds)]);if(a.removeLabelIds?.length)pairs.push(['外すラベル',labels(a.removeLabelIds)]);if(a.forward)pairs.push(['転送先',a.forward]);if(!Object.keys(a).length)pairs.push(['処理','指定なし']);for(const [k,v]of pairs)add(dl,node('dt',k),node('dd',v));return dl;}
  function changeCards(entries){const wrap=node('div');for(const e of entries.filter(e=>e.operation!=='NOOP'&&e.operation!=='REMOTE_ONLY')){const card=node('article',null,'change-card');add(card,node('span',operations[e.operation]||e.operation,'tag '+(e.operation==='DELETE'?'delete':'')),node('h2',(e.after?.criteria?.from||e.before?.criteria?.from||e.after?.criteria?.subject||e.before?.criteria?.subject||'フィルターの変更')));if(e.errors?.length)card.append(node('p',e.errors.join(' / '),'notice error'));if(e.warnings?.length)card.append(node('p',e.warnings.join(' / '),'muted'));if(e.risks?.length)card.append(node('p',e.risks.map(r=>r==='TRASH'?'ゴミ箱への移動を含みます':'転送を含みます').join(' / '),'notice warning'));if(e.operation==='ERROR'&&e.ruleKey)card.append(button('このフィルターを修正',async()=>edit(await rpc('detail',{key:e.ruleKey}))));const compare=node('div',null,'comparison'),before=node('div'),after=node('div',null,'after');add(before,node('h3','変更前'),filterDefinition(e.before));add(after,node('h3','変更後'),filterDefinition(e.after));add(compare,before,after);card.append(compare);const detail=node('details',null,'details');add(detail,node('summary','元データを確認'),node('pre',JSON.stringify({before:e.before,after:e.after},null,2),'json'));card.append(detail);wrap.append(card);}return wrap;}
  async function showPreview(){dirty=false;preview=await rpc('preview');renderPreview();}
  function renderPreview(){shell('変更内容を確認','追加・更新・削除の内容を確認してください。この画面を開くだけではGmailは変更されません。','preview');main.append(stats(preview.summary));main.append(node('p','変更なし '+preview.summary.NOOP+'件 / Gmail側のみ '+preview.summary.REMOTE_ONLY+'件（削除しません）','muted'));const n=preview.summary.CREATE+preview.summary.REPLACE+preview.summary.DELETE;const actions=node('div',null,'actions');if(preview.summary.ERROR)main.append(node('p',preview.summary.ERROR+'件の入力エラーがあります。修正してから再確認してください。','notice error'));else if(!n)main.append(node('p','反映が必要な変更はありません。','notice info'));else actions.append(button('反映の確認へ',prepare,''));actions.append(button('差分を再確認',showPreview));main.append(actions,changeCards(preview.entries));}
  async function prepare(){const p=await rpc('prepare',{runId:preview.runId});shell('Gmailへの反映を確認','以下の変更をGmailに反映します。内容を確認してから実行してください。','preview');main.append(stats(p.summary),node('p','バックアップを保存・検証しました。確認の有効期限は15分です。','notice info'));if(p.summary.REPLACE)main.append(node('p','更新は新規作成後に旧設定を削除します。一時的に新旧が同時に有効になり、転送などが重複する場合があります。','notice warning'));if(p.summary.TRASH||p.summary.FORWARD)main.append(node('p','ゴミ箱への移動 '+p.summary.TRASH+'件 / 転送 '+p.summary.FORWARD+'件を含みます。','notice warning'));main.append(changeCards(preview.entries));const label=node('label',null,'check-confirm'),check=node('input');check.type='checkbox';check.id='approve';add(label,check,node('span','変更内容を確認しました'));const apply=button('この変更をGmailに反映',async()=>{if(!check.checked)throw new Error('変更内容の確認にチェックしてください');pendingApplyRunId=p.runId;const r=await rpc('apply',{token:p.token});renderOutcome(r);await acknowledge(r.runId);},'');apply.disabled=true;check.addEventListener('change',()=>{apply.disabled=!check.checked;});add(main,label,apply,node('p','バックアップID: '+p.snapshotId,'count'),button('戻って差分を確認',async()=>renderPreview(),'tertiary'));}
  async function acknowledge(runId){try{await rpc('acknowledgeOutcome',{runId});}catch(_){/* A later reload will show the saved result again. */}}
  function showUnknown(runId,error){pendingApplyRunId='';preview=null;shell('反映結果を確認してください','通信が途切れたため、反映結果が分かりません。Gmailの処理は完了している可能性があります。','preview');main.append(node('p','反映を自動再実行しません。保存済みの結果、またはこの実行の履歴を確認してください。','notice warning'),node('p','実行ID: '+runId,'count'));if(error?.message)main.append(node('p',error.message,'muted'));add(main,button('保存済みの結果を確認',async()=>{const result=await rpc('outcome',{runId});if(result.status==='UNKNOWN')await history(0,runId);else{renderOutcome(result);await acknowledge(runId);}},''),button('この実行の履歴を確認',()=>history(0,runId)));}
  function renderOutcome(r){pendingApplyRunId='';preview=null;if(r.status==='UNKNOWN'){showUnknown(r.runId);return;}shell('反映結果','Gmailへの反映処理の結果です。','preview');const good=r.status==='OK';main.append(node('p',(good?'反映が完了しました。':r.status==='PARTIAL'?'一部の処理が完了しました。再度差分を確認してください。':'結果の確認または復旧が必要です。')+' 処理済み（変更なしを含む）'+r.completed+'件。','notice '+(good?'':'warning')));if(r.error)main.append(node('p',r.error,'notice error'));add(main,node('p','実行ID: '+r.runId,'count'),button('この実行の履歴を確認',()=>history(0,r.runId)),button('差分を再確認',showPreview));}
  function resultText(value){const map={OK:'完了',START:'開始',SAVED:'保存済み',CREATED:'作成済み',ERROR:'エラー',PARTIAL:'一部完了',RECOVERY_REQUIRED:'復旧が必要',CANCELLED:'キャンセル'};if(map[value])return map[value];for(const [k,label]of Object.entries(operations))if(value===k+' OK')return label+'完了';return value||'記録';}
  function verificationText(value){try{const v=JSON.parse(value);if('CREATE'in v)return ['CREATE','REPLACE','DELETE','NOOP','ERROR'].map(k=>operations[k]+' '+(v[k]||0)+'件').join(' / ');if('unresolved'in v)return '未解決 '+v.unresolved+'件 / Gmail側のみ '+v.remoteOnly+'件';}catch(_){}if(/^completed=\d+$/.test(value))return '処理済み（変更なしを含む）'+value.split('=')[1]+'件';return value;}
  async function history(start=0,runId=''){dirty=false;const r=await rpc('history',{offset:start,runId});shell('実行履歴','保存・取り込み・反映の結果を新しい順に表示します。','history');if(runId)main.append(node('p','この実行の履歴を表示しています。実行ID: '+runId,'notice info'));const actions=node('div',null,'actions');add(actions,button('履歴を更新',()=>history(start,runId)),button('Gmailとの一致を確認',async()=>{const result=await rpc('verify');message(result.ok?'管理対象のフィルターは一致しています。Gmail側のみ '+result.remoteOnly+'件。':'未解決の差分が'+result.unresolved.length+'件あります。変更確認を開いてください。',result.ok?'success':'warning');}));main.append(actions);if(!r.items.length)main.append(node('div','履歴はまだありません。','empty'));for(const item of r.items){const card=node('article',null,'history-card'),tags=node('div',null,'tags');add(tags,node('span',commands[item.Command]||item.Command,'tag'),node('strong',resultText(item.Result)));card.append(tags,node('p',item.TimestampTokyo||item.at||'','muted'));if(item.Error)card.append(node('p',item.Error,'notice error'));if(item.Verification)card.append(node('p',verificationText(item.Verification)));const detail=node('details',null,'details'),dl=node('dl',null,'history-details');for(const [k,label]of [['RunId','実行ID'],['RuleKey','フィルターID'],['SnapshotId','バックアップID'],['Actor','実行者'],['Risk','注意事項']])if(item[k])add(dl,node('dt',label),node('dd',item[k]));add(detail,node('summary','詳細'),dl);card.append(detail);main.append(card);}pager(main,r.total,start,next=>history(next,runId));if(runId)await acknowledge(runId);}
  for(const b of document.querySelectorAll('[data-page]'))b.addEventListener('click',action(async()=>{if(!canLeave())return;dirty=false;if(b.dataset.page==='filters')await list();else if(b.dataset.page==='preview')await showPreview();else await history();}));
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  action(async()=>{boot=await rpc('boot');if(boot.unseenOutcome){renderOutcome(boot.unseenOutcome);if(boot.unseenOutcome.status!=='UNKNOWN')await acknowledge(boot.unseenOutcome.runId);}else await list();})().catch(()=>{});
})();
</script>
