<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),main=$('main');
  const homeContent=[...main.childNodes].map(n=>n.cloneNode(true));
  const operations={CREATE:'追加',REPLACE:'更新',DELETE:'削除',NOOP:'変更なし',ERROR:'入力エラー',REMOTE_ONLY:'Gmail側のみ'};
  const commands={IMPORT:'インポート',PREVIEW:'差分確認',APPLY:'フィルター適用',VERIFY:'適用後の検証',RECOVER:'復旧',LABEL_APPLY:'ラベル反映',LABEL_RECOVER:'ラベル復旧',WEB_SAVE:'旧画面での保存',MESSAGES:'既存メールの整理'};
  let working=false,userStarted=false,mode='ALL',preview=null,labels=[],selected=new Set(),pendingApplyRunId='',pendingMessageRunId='',savedMessageJob=null,savedFilterJob=null,savedPreparation=null,filterPoll=null,preparationPoll=null,activeFilterView='';
  let viewEpoch=0,currentView=null,selectionRevision=0,confirmationSource=null;
  function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined&&text!==null)el.textContent=String(text);if(cls)el.className=cls;return el;}
  function add(parent,...children){children.filter(Boolean).forEach(child=>parent.append(child));return parent;}
  function button(text,fn,style='secondary'){const b=node('button',text,'button '+style);b.type='button';b.addEventListener('click',action(fn));return b;}
  function clearMessage(){for(const id of ['notice','error']){$(id).hidden=true;$(id).replaceChildren();}}
  function message(text,type='success'){const el=type==='error'?$('error'):$('notice');el.replaceChildren(node('p',text));el.hidden=false;el.className='notice '+(type==='error'?'error':type==='warning'?'warning':type==='info'?'info':'');if(type==='error')el.focus();}
  let disabledControls=[],interruptedRequest=null,recoveryView=null,recoveryPoll=null,recoveryRead=0;
  function setBusy(value){
    working=value;$('busy').hidden=!value;
    if(value){main.setAttribute('aria-busy','true');disabledControls=[...document.querySelectorAll('button,input,select,textarea')].map(el=>[el,el.disabled]);disabledControls.forEach(([el])=>el.disabled=true);}
    else{main.removeAttribute('aria-busy');disabledControls.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled;});disabledControls=[];}
  }
  function getStorage(){try{return window.sessionStorage;}catch(_){return undefined;}}
  const session=GFMClientSession.create({request:rawRpc,onBusy:setBusy,storage:getStorage(),isVisible:()=>!document.hidden,
    onError:err=>{if(pendingMessageRunId)showMessageUnknown(pendingMessageRunId,err);else if(pendingApplyRunId)showUnknown(pendingApplyRunId,err);else message(err?.message||'通信に失敗しました。実行ログを確認してください。','error');},
    onRecoveredResponse:()=>{interruptedRequest=null;clearTimeout(recoveryPoll);recoveryRead++;},
    onRecover:req=>{viewEpoch++;userStarted=true;pendingApplyRunId='';pendingMessageRunId='';preview=null;interruptedRequest=req;recoverRequest(req);}
  });
  function action(fn){return event=>{if(event?.preventDefault)event.preventDefault();if(working)return;viewEpoch++;recoveryRead++;userStarted=true;clearMessage();return session.run(()=>fn(event));};}
  function rawRpc(command,input={}){
    if(window.GFM_LOCAL)return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,input})}).then(r=>r.json()).then(r=>{if(r.error)throw new Error(r.error);return r.data;});
    return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).GFM_web(command,input));
  }
  function rpc(command,input={}){return session.call(command,input);}
  function readWithDeadline(command,input){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('状況確認がタイムアウトしました。再確認できます。')),10000);rawRpc(command,input).then(v=>{clearTimeout(timer);resolve(v);},e=>{clearTimeout(timer);reject(e);});});}
  function rememberView(view){if(view){currentView=view;session.remember(view);}}
  function saveSelection(){
    if(!currentView)return;const epoch=viewEpoch;
    rawRpc('viewUpdate',{...currentView,keys:[...selected],revision:++selectionRevision}).then(r=>{if(epoch===viewEpoch&&r.status!=='OK'&&r.status!=='STALE')message('選択内容を保存できませんでした。再読み込み前に保存済み画面を確認してください。','warning');}).catch(()=>{if(epoch===viewEpoch)message('選択内容を保存できませんでした。選択し直して再保存できます。','warning');});
  }
  function retrySavedView(action,error){
    shell('保存した画面を再確認','保存期限・設定変更・通信状態を確認してください。');main.append(node('p',error||'保存した表示が見つからないか、確認が失効しています。','notice warning'));
    const retry=action==='importCheck'?importCheck:action==='messagesList'?messagesList:action==='messagesPrepare'&&savedMessageJob?()=>prepareMessages(savedMessageJob.runId):action==='messagesStatus'&&savedMessageJob?()=>loadMessageStatus(savedMessageJob.runId):()=>loadPreview(mode);
    add(main,button('取得し直す',retry,''),button('操作に戻る',()=>showHome(),'tertiary'));
  }
  function renderSavedView(saved){
    if(saved.status==='JOB'){session.forgetView();currentView=null;renderFilterJob(saved.result);return;}
    if(saved.status!=='OK'){retrySavedView(saved.action,saved.error);return;}
    if(['prepare','prepareStart','prepareRemaining'].includes(saved.action))confirmationSource=saved.sourceView||null;
    mode=saved.mode||'ALL';selected=new Set(saved.keys||[]);selectionRevision=saved.revision||0;rememberView(saved.result?._view||saved);const r=saved.result;
    if(saved.action==='preview'){preview=r;labels=r.labels||[];renderPreview();}
    else if(['prepareStart','prepareRemaining'].includes(saved.action))renderPreparation(r);
    else if(saved.action==='prepare')renderConfirmation(r);
    else if(saved.action==='importCheck')renderImportCheck(r);
    else if(saved.action==='messagesList')renderMessagesList(r);
    else if(saved.action==='messagesPrepare')renderMessagesConfirmation(r);
  }
  async function loadSavedView(view){
    const epoch=viewEpoch;
    try{if(view.action==='messagesStatus'){const result=await readWithDeadline('messagesStatus',{runId:view.runId});if(epoch===viewEpoch)renderMessageStatus(result);return;}
      const saved=await readWithDeadline('viewGet',view);if(epoch===viewEpoch)renderSavedView(saved);}
    catch(e){if(epoch===viewEpoch)retrySavedView(view.action,e.message);}
  }
  async function recoverRequest(req){
    const sequence=++recoveryRead;clearTimeout(recoveryPoll);
    if(!session.isRecovery(req))return;
    if(!req.requestId){session.finish(req);interruptedRequest=null;showHome();message('画面を復元しました。必要な操作を選び直してください。','info');return;}
    if(recoveryView?.req!==req||!recoveryView.text.isConnected){
      clearMessage();shell('実行状況を確認','画面を離れても、開始済み処理の結果を保存済み状態から確認できます。変更処理を自動再送しません。');
      const text=node('p','保存済みの状況を取得しています。','notice info'),count=node('p','','selection-count'),refresh=node('button','状況を更新','button secondary');refresh.type='button';refresh.addEventListener('click',()=>recoverRequest(req));
      const actions=node('div',null,'actions');add(actions,refresh,button('操作に戻る',()=>showHome(),'tertiary'));add(main,text,count,actions);
      recoveryView={req,text,count,refresh,misses:0};
    }
    const view=recoveryView;view.refresh.disabled=true;
    try{
      const status=await readWithDeadline('resume',{requestId:req.requestId});
      if(!session.isRecovery(req)||sequence!==recoveryRead)return;
      if(status.messageJob){savedMessageJob=status.messageJob;view.count.textContent=messageCountText(status.messageJob);}
      if(status.status==='RUNNING'){
        view.text.textContent=status.action==='messagesScan'?'検索リクエストの完了を確認しています。最後の保存状況を表示しています。メールはまだ変更していません。':'サーバーで処理中です。この画面を表示し続ける必要はありません。戻ったときに状況を確認します。';
        recoveryPoll=setTimeout(()=>{if(!document.hidden&&session.isRecovery(req))recoverRequest(req);},3000);return;
      }
      if(status.status==='NOT_FOUND'){
        view.text.textContent='この操作の受付・結果をまだ確認できません。自動再実行はしません。「状況を更新」か実行ログで確認してください。';
        if(++view.misses<5)recoveryPoll=setTimeout(()=>{if(!document.hidden&&session.isRecovery(req))recoverRequest(req);},3000);return;
      }
      if(status.status==='UNKNOWN'&&status.action==='messagesScan'){
        view.text.textContent='検索リクエストの完了を確認できません。表示件数は最後の保存状況です。「状況を更新」で受付・結果を確認してください。検索もメール変更も自動再送しません。';return;
      }
      if(status.status==='DONE'&&status.viewId){
        const saved=await readWithDeadline('viewGet',{viewId:status.viewId,runId:status.runId});if(!session.isRecovery(req)||sequence!==recoveryRead)return;
        session.finish(req);interruptedRequest=null;renderSavedView(saved);return;
      }
      if(status.preparationId){session.finish(req);interruptedRequest=null;await loadPreparation(status.preparationId);return;}
      if(status.action?.startsWith('messages')&&status.runId&&status.messageJob){
        const full=await readWithDeadline('messagesStatus',{runId:status.runId});if(!session.isRecovery(req)||sequence!==recoveryRead)return;
        session.finish(req);interruptedRequest=null;renderMessageStatus(full);return;
      }
      session.finish(req);interruptedRequest=null;
      if(status.action==='apply'&&status.result){renderOutcome(status.result);if(status.result.status!=='UNKNOWN')rawRpc('acknowledgeOutcome',{runId:status.result.runId}).catch(()=>{});return;}
      if(status.status==='UNKNOWN'&&status.action==='apply'&&(status.runId||req.runId)){showUnknown(status.runId||req.runId,Error('処理結果が未確定です。実行ログを確認してください。'));return;}
      if(status.status==='DONE'&&status.action==='import'&&status.result){const r=status.result;shell('インポート完了','フィルター'+r.count+'件・ラベル'+(r.labelCount||0)+'件を追加しました。');add(main,button('この実行のログ',()=>history(0,r.runId)),button('操作に戻る',()=>showHome()));return;}
      showHome();message(status.status==='DONE'?'処理の完了を確認しました。必要な差分・確認画面は取得し直してください。':status.error||'処理結果が未確定です。実行ログを確認してから操作してください。',status.status==='DONE'?'info':'warning');
    }catch(err){if(session.isRecovery(req)&&sequence===recoveryRead)view.text.textContent=err.message+' 変更処理は再送していません。';}
    finally{if(view.refresh.isConnected&&sequence===recoveryRead)view.refresh.disabled=false;}
  }
  function navigation(page){document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
  function shell(title,lead,page='home'){clearTimeout(filterPoll);clearTimeout(preparationPoll);activeFilterView='';main.replaceChildren(node('h1',title),node('p',lead,'lead'));navigation(page);main.focus();window.scrollTo(0,0);}
  function showHome(focus=true){clearTimeout(filterPoll);clearTimeout(preparationPoll);activeFilterView='';
    main.replaceChildren(...homeContent.map(n=>n.cloneNode(true)));navigation('home');
    const handlers={import:importCheck,all:()=>loadPreview('ALL'),selected:()=>loadPreview('SELECTED'),history:()=>history(),messages:messagesList};
    for(const b of main.querySelectorAll('[data-command]'))b.addEventListener('click',action(handlers[b.dataset.command]));
    if(interruptedRequest)main.append(button('中断した操作の状況を確認',()=>session.resume(interruptedRequest)));
    if(savedFilterJob)main.append(button('保存済みのフィルター適用状況を確認',()=>loadFilterJob(savedFilterJob.runId)));
    if(savedPreparation)main.append(button('保存済みの適用確認を開く',()=>loadPreparation(savedPreparation.preparationId)));
    if(session.viewLocator())main.append(button('保存済みの確認画面を開く',()=>loadSavedView(session.viewLocator())));
    if(savedMessageJob)main.append(button('保存済みの既存メール処理を確認',()=>loadMessageStatus(savedMessageJob.runId)));
    if(focus){main.focus();window.scrollTo(0,0);}
  }
  function stats(summary){const grid=node('div',null,'summary-grid');for(const k of ['CREATE','REPLACE','DELETE']){const box=node('div',null,'stat');add(box,node('strong',summary[k]||0),node('span',operations[k]));grid.append(box);}return grid;}
  function candidates(entries){return entries.filter(e=>!['NOOP','REMOTE_ONLY'].includes(e.operation)||(e.operation==='NOOP'&&e.matchedId));}
  function titleOf(e){if(e.kind==='LABEL')return e.after?.name||e.before?.name||'ラベル';return e.after?.criteria?.from||e.before?.criteria?.from||e.after?.criteria?.subject||e.before?.criteria?.subject||e.after?.criteria?.query||e.before?.criteria?.query||'フィルターの変更';}
  function filterDefinition(filter){
    const dl=node('dl',null,'definition');if(!filter){dl.append(node('dd','設定なし'));return dl;}if(!filter.criteria&&!filter.action&&'name'in filter){add(dl,node('dt','ラベル名'),node('dd',filter.name));return dl;}
    const system={INBOX:'受信トレイ',UNREAD:'未読',SPAM:'迷惑メール',IMPORTANT:'重要',STARRED:'スター',TRASH:'ゴミ箱'};
    const labelText=ids=>ids.map(id=>system[id]||labels.find(l=>l.id===id)?.name||id).join('、');
    const names={from:'送信元',to:'宛先',subject:'件名',query:'含む条件',negatedQuery:'含まない条件',hasAttachment:'添付ファイルあり',excludeChats:'チャットを除外',size:'サイズ（バイト）',sizeComparison:'サイズの比較'};
    for(const [key,value]of Object.entries(filter.criteria||{})){
      const text=typeof value==='boolean'?(value?'はい':'いいえ'):key==='sizeComparison'?({larger:'より大きい',smaller:'より小さい',unspecified:'指定なし'}[value]||value):value;
      add(dl,node('dt',names[key]||key),node('dd',text));
    }
    const a=filter.action||{};if(a.addLabelIds?.length)add(dl,node('dt','付けるラベル'),node('dd',labelText(a.addLabelIds)));if(a.removeLabelIds?.length)add(dl,node('dt','外すラベル'),node('dd',labelText(a.removeLabelIds)));if(a.forward)add(dl,node('dt','転送先'),node('dd',a.forward));if(!Object.keys(a).length)add(dl,node('dt','処理'),node('dd','指定なし'));return dl;
  }
  function cards(entries,selectable=false,onSelection=()=>{}){
    const wrap=node('div');for(const e of candidates(entries)){
      const card=node('article',null,'change-card');add(card,node('span',e.matchedId&&e.operation==='NOOP'?'IDの紐付け':e.kind==='LABEL'?e.operation==='REPLACE'?'ラベル名変更':e.operation==='CREATE'?'ラベル作成':'ラベル・'+operations[e.operation]:operations[e.operation],'tag '+(e.operation==='DELETE'?'delete':'')),node('h2',titleOf(e)));
      if(selectable&&e.ruleKey){const label=node('label',null,'selection-label'),check=node('input');check.type='checkbox';check.checked=selected.has(e.ruleKey);check.dataset.ruleKey=e.ruleKey;add(label,check,node('span',e.kind==='LABEL'?'このラベル変更を選択':'この変更を選択'));check.addEventListener('change',()=>{if(check.checked)selected.add(e.ruleKey);else selected.delete(e.ruleKey);for(const other of wrap.querySelectorAll('input[data-rule-key]'))other.checked=selected.has(other.dataset.ruleKey);onSelection();});card.append(label);}
      if(e.errors?.length)card.append(node('p',e.errors.join(' / '),'notice error'));if(e.warnings?.length)card.append(node('p',e.warnings.join(' / '),'muted'));if(e.risks?.length)card.append(node('p',e.risks.map(r=>r==='TRASH'?'ゴミ箱への移動を含みます':'転送を含みます').join(' / '),'notice warning'));
      const compare=node('div',null,'comparison'),before=node('div'),after=node('div',null,'after');add(before,node('h3','変更前'),filterDefinition(e.before));add(after,node('h3','変更後'),filterDefinition(e.after));add(compare,before,after);card.append(compare);
      const detail=node('details',null,'details');add(detail,node('summary','元データを確認'),node('pre',JSON.stringify({before:e.before,after:e.after},null,2),'json'));card.append(detail);wrap.append(card);
    }return wrap;
  }
  async function importCheck(){renderImportCheck(await rpc('importCheck'));}
  function renderImportCheck(check){rememberView(check._view);shell('インポートを確認','Gmailの設定は変更せず、未登録のフィルターとラベルをスプレッドシートに追加します。');main.append(node('p','Gmail全'+check.total+'件 / 未登録'+check.count+'件。ラベル全'+(check.labelTotal||0)+'件 / 未登録'+(check.labelCount||0)+'件。既存の編集内容は維持します。','notice info'));
    const actions=node('div',null,'actions');add(actions,button('フィルター'+check.count+'件・ラベル'+(check.labelCount||0)+'件をインポート',async()=>{const r=await rpc('import',{token:check.token});preview=null;shell('インポート完了','フィルター'+r.count+'件・ラベル'+(r.labelCount||0)+'件を追加しました。');add(main,button('この実行のログ',()=>history(0,r.runId)),button('操作に戻る',()=>showHome()));},''),button('キャンセル',()=>showHome()));main.append(actions);
  }
  async function loadPreview(nextMode){mode=nextMode;selected=new Set();preview=await rpc('preview',{_viewMode:mode});rememberView(preview._view);selectionRevision=0;labels=preview.labels||[];renderPreview();}
  function renderPreview(){rememberView(preview._view);
    const partial=mode==='SELECTED',items=candidates(preview.entries);shell(partial?'適用する変更を選択':'全部適用の内容を確認',partial?'反映するフィルター・ラベルを選んでください。選択したフィルターに必要なラベル変更も確認画面に追加します。':'フィルターとラベルを、スプレッドシートの状態に揃えます。Gmail側で変更されたラベル名も上書きします。');
    main.append(stats(preview.summary),node('p','変更なし '+preview.summary.NOOP+'件 / Gmail側のみ '+preview.summary.REMOTE_ONLY+'件（削除しません）','muted'));
    if(!items.length){main.append(node('p','適用が必要な変更はありません。','notice info'),button('操作に戻る',()=>showHome()));return;}
    if(preview.summary.ERROR)main.append(node('p','入力エラーが'+preview.summary.ERROR+'件あります。設定の修正はスプレッドシートで行ってください。選択適用では対象の内容を再検証します。','notice warning'));
    const tools=node('div',null,'selection-tools'),count=node('p',null,'selection-count');count.setAttribute('role','status');
    const next=button(partial?'選択した内容の確認へ':'全部適用の確認へ',prepare,'');
    const update=()=>{count.textContent='選択 '+selected.size+'件';next.disabled=selected.size===0;};
    const changed=()=>{update();saveSelection();};
    if(partial){const a=node('div',null,'actions');add(a,button('すべて選択',async()=>{selected=new Set(items.filter(e=>e.operation!=='ERROR').map(e=>e.ruleKey).filter(Boolean));saveSelection();renderPreview();}),button('選択を解除',async()=>{selected.clear();saveSelection();renderPreview();}));add(tools,count,a);main.append(tools);update();}else next.disabled=!!preview.summary.ERROR;
    const actions=node('div',null,'actions');add(actions,next,button('差分を再取得',()=>loadPreview(mode)),button('操作に戻る',()=>showHome(),'tertiary'));main.append(actions,cards(preview.entries,partial,changed));
  }
  async function prepare(){
    confirmationSource=preview._view||null;
    const p=await rpc('prepareStart',{runId:preview.runId,_viewMode:mode,_sourceViewId:preview._view?.viewId,...(mode==='SELECTED'?{keys:[...selected]}:{})});renderPreparation(p);
  }
  function renderPreparation(result){
    savedPreparation=result;rememberView(result._view);
    if(result.status==='READY'){renderConfirmation(result);return;}
    shell('適用内容の確認を準備','差分の検証とバックアップを段階ごとに保存しています。画面を閉じても準備は続きます。');
    const text=node('p',result.status==='PAUSED'?result.error||'確認準備を中断しました。差分を再取得してください。':'確認準備中 / '+(result.phase||'受付済み'),'notice '+(result.status==='PAUSED'?'warning':'info'));
    add(main,text,button('保存済みの確認状況を更新',()=>loadPreparation(result.preparationId)),button('操作に戻る',()=>showHome(),'tertiary'));
    if(result.status==='PREPARING'){const epoch=viewEpoch;preparationPoll=setTimeout(()=>{if(!document.hidden&&epoch===viewEpoch)readWithDeadline('prepareStatus',{preparationId:result.preparationId}).then(r=>{if(epoch===viewEpoch)renderPreparation(r);}).catch(()=>{text.textContent='状況を取得できませんでした。保存済みの確認状況を更新できます。';});},5000);}
  }
  async function loadPreparation(preparationId){const epoch=viewEpoch;try{const r=await readWithDeadline('prepareStatus',{preparationId});if(epoch===viewEpoch)renderPreparation(r);}catch(e){if(epoch===viewEpoch)retrySavedView('prepareStart',e.message);}}
  function renderConfirmation(p){rememberView(p._view);labels=p.labels||labels;

    shell(p.selection?'選択した変更を適用':'全部適用を確認',p.selection?'依存するラベルを含め、以下の'+p.selection.count+'件を適用します。':'以下の変更をまとめてGmailに適用します。');main.append(stats(p.summary),node('p','バックアップを保存・検証しました。確認の有効期限は15分です。','notice info'));
    if(p.entries.some(e=>e.kind!=='LABEL'&&e.operation==='REPLACE'))main.append(node('p','更新時は、一時的に新旧のフィルターが同時に有効になります。転送などが重複する場合があります。','notice warning'));if(p.summary.TRASH||p.summary.FORWARD)main.append(node('p','ゴミ箱への移動 '+p.summary.TRASH+'件 / 転送 '+p.summary.FORWARD+'件を含みます。','notice warning'));
    main.append(cards(p.entries));const label=node('label',null,'check-confirm'),check=node('input');check.type='checkbox';add(label,check,node('span','上記の変更内容を確認しました'));
    const apply=button(p.selection?'選択した変更をGmailに適用':'全部Gmailに適用',async()=>{if(!check.checked)throw Error('変更内容の確認にチェックしてください');pendingApplyRunId=p.runId;const result=await rpc('apply',{token:p.token});renderOutcome(result);await acknowledge(result.runId);},'');apply.disabled=true;check.addEventListener('change',()=>{apply.disabled=!check.checked;});add(main,label,apply,node('p','バックアップID: '+p.snapshotId,'count'),button('差分に戻る',async()=>{if(preview)renderPreview();else if(confirmationSource)await loadSavedView(confirmationSource);else retrySavedView('preview','元の差分表示が見つかりません。「取得し直す」で最新の差分を確認してください。');},'tertiary'));
  }
  async function acknowledge(runId){try{await rpc('acknowledgeOutcome',{runId});}catch(_){/* The saved result remains available on reload. */}}
  function showUnknown(runId,error){pendingApplyRunId='';preview=null;shell('適用結果を確認してください','通信が途切れたため、結果が分かりません。処理は完了している可能性があります。');main.append(node('p','適用を自動再実行しません。保存済みの結果か実行ログを確認してください。','notice warning'),node('p','実行ID: '+runId,'count'));if(error?.message)main.append(node('p',error.message,'muted'));add(main,button('保存済みの結果を確認',async()=>{const r=await rpc('outcome',{runId});if(r.status==='UNKNOWN')await history(0,runId);else{renderOutcome(r);await acknowledge(runId);}},''),button('この実行のログ',()=>history(0,runId)));}
  function renderOutcome(result){if(result.job){renderFilterJob(result);return;}pendingApplyRunId='';preview=null;if(result.status==='UNKNOWN'){showUnknown(result.runId);return;}shell('適用結果','Gmailへの適用結果です。');const ok=result.status==='OK';main.append(node('p',(ok?'適用が完了しました。':result.status==='PARTIAL'?'一部が完了しました。差分を再確認してください。':'確認または復旧が必要です。')+' 処理済み（変更なしを含む）'+result.completed+'件。','notice '+(ok?'':'warning')));if(ok&&result.remaining)main.append(node('p','選択外の差分が'+result.remaining+'件残っています。','notice info'));if(result.error)main.append(node('p',result.error,'notice error'));add(main,node('p','実行ID: '+result.runId,'count'),button('この実行のログ',()=>history(0,result.runId)),button('操作に戻る',()=>showHome()));}
  async function loadFilterJob(runId){renderFilterJob(await rpc('filterJobStatus',{runId}));}
  function preparationBelongsToJob(p,j){return !!(p&&j&&(p.preparationId===j.preparationId||p.runId&&p.runId===j.runId));}
  function preparationFollowsJob(p,j){return !j||p.previousRunId===j.runId||Math.max(p.createdAt??0,p.updatedAt??0)>=(j.updatedAt??0);}
  function renderFilterJob(result){
    if(currentView&&(currentView.action!=='prepareRemaining'&&currentView.runId===result.runId||preparationBelongsToJob(savedPreparation,result))){session.forgetView();currentView=null;}
    savedFilterJob=result;if(preparationBelongsToJob(savedPreparation,result))savedPreparation=null;pendingApplyRunId='';preview=null;
    const states={ACCEPTED:'受付済み',RUNNING:'実行中',WAITING:'自動続行待ち',PAUSED:'中断・要確認',OK:'完了'},phases={SHEET_READ:'シートの検証',DIFF_CHECK:'承認した差分の再検証',BACKUP_CHECK:'バックアップ検証',REFERENCES:'ラベル参照の準備',APPLY:'Gmailへ反映・照合',FINAL_REFERENCES:'参照名の更新',VERIFY:'反映結果の最終照合'};
    shell('フィルター適用の進捗',states[result.status]||result.status);activeFilterView=result.runId;
    const text=node('p',result.status==='OK'?'承認した変更の反映を確認しました。':result.status==='PAUSED'?'処理を中断しています。停止理由を確認して、残りの差分を再確認してください。':'承認済みの内容を自動で続行します。この画面を表示し続ける必要はありません。','notice '+(result.status==='PAUSED'?'warning':'info'));main.append(text);
    for(const [key,label]of [['labels','ラベル'],['filters','フィルター']]){const count=result[key]||{planned:0,completed:0,remaining:0};main.append(node('p',label+'：予定 '+count.planned+'件 / 反映確認済み '+count.completed+'件 / 残り '+count.remaining+'件','selection-count'));}
    main.append(node('p','現在工程：'+(phases[result.phase]||result.phase)+' / 最終更新：'+new Date(result.updatedAt).toLocaleString('ja-JP'),'muted'));
    if(result.uncertain)main.append(node('p','結果不明 '+result.uncertain+'件。残りの確認時にGmailの現状と照合し、自動再作成を防ぎます。','notice warning'));
    if(result.error)main.append(node('p',result.error,'notice warning'));
    if(result.recovered)main.append(node('p','中断した実行または停止したトリガーを検知し、自動継続を復旧しました。','notice info'));
    const actions=node('div',null,'actions');add(actions,button('保存済みの進捗を更新',()=>loadFilterJob(result.runId)),button('この実行のログ',()=>history(0,result.runId)));
    if(result.status==='PAUSED')actions.append(button('残りの差分を確認して続ける',async()=>{const p=await rpc('prepareRemaining',{runId:result.runId});if(p.job)renderFilterJob(p);else renderPreparation(p);},''));
    add(main,actions,node('p','実行ID: '+result.runId,'count'),button('操作に戻る',()=>showHome(),'tertiary'));
    if(['ACCEPTED','RUNNING','WAITING'].includes(result.status))filterPoll=setTimeout(()=>{if(!document.hidden&&activeFilterView===result.runId)rawRpc('filterJobStatus',{runId:result.runId}).then(r=>{if(activeFilterView===result.runId)renderFilterJob(r);}).catch(()=>{text.textContent='保存済みの進捗を取得できませんでした。「進捗を更新」で再確認できます。';});},5000);
  }
  function messageActionText(action){
    const parts=[];for(const id of action.addLabelIds||[])parts.push('ラベル「'+(labels.find(l=>l.id===id)?.name||id)+'」を追加');
    if(action.removeLabelIds?.includes('INBOX'))parts.push('アーカイブ');if(action.removeLabelIds?.includes('UNREAD'))parts.push('既読化');return parts.join(' / ')||'実行する処理なし';
  }
  function messageCards(entries,selectable=false,onSelection=()=>{}){
    const wrap=node('div');for(const e of entries){
      const card=node('article',null,'change-card');card.append(node('h2',e.title));
      if(selectable){const label=node('label',null,'selection-label'),check=node('input');check.type='checkbox';check.disabled=!e.eligible||!!e.errors.length;check.checked=selected.has(e.key);add(label,check,node('span','このフィルターを選択'));check.addEventListener('change',()=>{if(check.checked)selected.add(e.key);else selected.delete(e.key);onSelection();});card.append(label);}
      if(e.count!==undefined)card.append(node('p','一致したメール '+e.count+'件','tag'));
      card.append(node('p',messageActionText(e.action||{}),'notice info'));
      if(e.ignored?.length)card.append(node('p','既存メールには実行しません: '+e.ignored.join(' / '),'notice warning'));
      if(e.errors?.length)card.append(node('p',e.errors.join(' / '),'notice error'));
      if(e.filter){const detail=node('details',null,'details');add(detail,node('summary','検索条件と実行する処理'),filterDefinition({criteria:e.filter.criteria,action:e.action}));card.append(detail);}
      wrap.append(card);
    }return wrap;
  }
  async function messagesList(){
    if(savedMessageJob&&!['OK','CANCELLED'].includes(savedMessageJob.status)){await loadMessageStatus(savedMessageJob.runId);return;}
    const view=await rpc('messagesList');selected=new Set();selectionRevision=0;renderMessagesList(view);
  }
  function renderMessagesList(view){rememberView(view._view);labels=view.labels||[];
    shell('既存メールへ適用するフィルター','受信済みのメールを整理します。フィルター設定の反映とは別の操作です。');
    main.append(node('p','ラベル付与・アーカイブ・既読化のみを実行します。検索開始時より前のメールが対象です。迷惑メール・ゴミ箱・下書き・送信済みは除外します。','notice info'));
    if(!view.entries.length){add(main,node('p','有効なフィルターがありません。','empty'),button('操作に戻る',()=>showHome()));return;}
    const count=node('p','選択 '+selected.size+'件','selection-count'),next=button('選択したフィルターのメールを検索',()=>startMessages([...selected]),'');next.disabled=true;
    const update=()=>{count.textContent='選択 '+selected.size+'件';next.disabled=selected.size===0;saveSelection();};next.disabled=selected.size===0;
    const all=button('適用できる全件のメールを検索',()=>startMessages(null),'');all.disabled=view.entries.some(e=>e.errors.length)||!view.entries.some(e=>e.eligible);
    add(main,all,node('h2','選択して適用'),count,messageCards(view.entries,true,update),next,button('操作に戻る',()=>showHome(),'tertiary'));
  }
  async function startMessages(keys){const run=await rpc('messagesStart',{keys});await scanMessages(run);}
  async function scanMessages(run){
    renderMessageStatus(run,true);pendingMessageRunId=run.runId;renderMessageStatus(await rpc('messagesScan',{runId:run.runId}));
  }
  function messageCountText(result){
    const scanning=result.totalKnown===false||['SCANNING','SCAN_FAILED'].includes(result.status);
    return (scanning?'検索済み':'対象')+' 延べ'+result.total+'件 / 処理済み '+result.completed+'件 / '+(scanning?'検索済みの未処理':'未処理')+' '+result.remaining+'件 / 結果不明 '+(result.uncertain||0)+'件'+(scanning?'（総対象件数は未確定）':'');
  }
  async function loadMessageStatus(runId){renderMessageStatus(await rpc('messagesStatus',{runId}));}
  function renderMessageStatus(result,requestPending=false){
    pendingMessageRunId='';savedMessageJob=result;labels=result.labels||labels;
    // Message progress is already persisted; remember only its status route and RunId.
    rememberView({viewId:'',action:'messagesStatus',runId:result.runId});
    shell('既存メールの処理状況','メール単位で処理します。同じメールが複数のフィルターに一致した場合は延べ件数として数えます。');
    const scanning=['SCANNING','SCAN_FAILED'].includes(result.status),done=result.status==='OK';
    if(done)main.append(node('p','既存メールへの適用が完了しました。','notice'));
    else if(requestPending)main.append(node('p','検索リクエストの応答を待っています。このバッチを検索しています。メールはまだ変更していません。','notice info'));
    else if(result.status==='SCAN_FAILED')main.append(node('p','対象メールの検索に失敗しました。原因を確認し、「検索を再試行」で保存済みの対象から続行してください。メールはまだ変更していません。','notice error'));
    else if(scanning)main.append(node('p','ここまで検索済み・続行待ちです。「対象メールの検索を続ける」で次のバッチへ進んでください。待つだけでは進みません。メールはまだ変更していません。','notice info'));
    else if(result.status==='CANCELLED')main.append(node('p','処理を中止しました。処理済みの変更は維持されます。','notice warning'));
    else main.append(node('p',result.status==='READY'?'検索が完了しました。対象件数と処理内容を確認してから実行してください。':'処理の続行には、もう一度内容を確認してください。','notice info'));
    main.append(node('p',messageCountText(result),'selection-count'));
    if(scanning)main.append(node('p','件数は保存済みのメールIDをフィルターごとに数えた累計です。同じメールが複数定義に一致すると重複して数えます。全体の完了率は検索完了まで確定しません。','muted'));
    if(result.uncertain)main.append(node('p','結果不明 '+result.uncertain+'件（未処理件数に含みます）。続行時は保存済みの同じメールへ再適用します。ラベルは重複しません。','notice warning'));
    if(result.error)main.append(node('p',result.error,'notice error'));
    const actions=node('div',null,'actions');
    if(requestPending){main.append(messageCards(result.entries||[]),node('p','実行ID: '+result.runId,'count'));return;}
    if(scanning)actions.append(button(result.status==='SCAN_FAILED'?'検索を再試行':'対象メールの検索を続ける',()=>scanMessages(result),''));
    else if(!done&&result.status!=='CANCELLED')actions.append(button('既存メールへの適用を確認',()=>prepareMessages(result.runId),''));
    add(actions,button('保存済みの状況を更新',()=>loadMessageStatus(result.runId)),button('この実行のログ',()=>history(0,result.runId)));
    if(!done&&result.status!=='CANCELLED')actions.append(button('残りの処理を中止する',async()=>{
      shell('既存メール処理の中止を確認','処理済みのメールは元に戻りません。残りの処理を中止します。');
      add(main,button('残りの処理を中止する',async()=>renderMessageStatus(await rpc('messagesCancel',{runId:result.runId})),''),button('状況に戻る',()=>loadMessageStatus(result.runId)));
    },'tertiary'));
    add(main,actions,messageCards(result.entries||[]),node('p','実行ID: '+result.runId,'count'),button('操作に戻る',()=>showHome(),'tertiary'));
  }
  async function prepareMessages(runId){
    renderMessagesConfirmation(await rpc('messagesPrepare',{runId}));
  }
  function renderMessagesConfirmation(p){const runId=p.runId;rememberView(p._view);labels=p.labels||labels;
    shell('既存メールへの適用を確認','保存済みの対象メールへ、以下の3種類の処理だけを実行します。確認の有効期限は15分です。');
    main.append(node('p','対象 延べ'+p.total+'件 / 処理済み '+p.completed+'件 / 未処理 '+p.remaining+'件','selection-count'));
    if(p.uncertain)main.append(node('p','結果不明 '+p.uncertain+'件は、保存済みの同じメールへ再適用します。','notice warning'));
    main.append(messageCards(p.entries));const label=node('label',null,'check-confirm'),check=node('input');check.type='checkbox';add(label,check,node('span','既存メールの変更内容と対象外の処理を確認しました'));
    const apply=button('確認した既存メールを処理する',async()=>{if(!check.checked)throw Error('既存メールの変更内容を確認してください');pendingMessageRunId=runId;renderMessageStatus(await rpc('messagesApply',{token:p.token}));},'');
    apply.disabled=true;check.addEventListener('change',()=>{apply.disabled=!check.checked;});
    add(main,label,apply,node('p','大量の対象は小分けに処理します。途中で画面を閉じても、操作画面から保存済みの状況を確認できます。','muted'),button('状況に戻る',()=>loadMessageStatus(runId),'tertiary'));
  }
  function showMessageUnknown(runId,error){
    pendingMessageRunId='';shell('既存メールの結果を確認してください','通信が途切れました。処理は進んでいる可能性があります。保存済みの状況を確認してください。');
    if(error?.message)main.append(node('p',error.message,'notice warning'));
    add(main,button('保存済みの既存メール処理を確認',()=>loadMessageStatus(runId),''),button('この実行のログ',()=>history(0,runId)),node('p','実行ID: '+runId,'count'));
  }
  function resultText(value){const map={OK:'完了',START:'開始',SAVED:'保存済み',CREATED:'作成済み',ERROR:'エラー',PARTIAL:'一部完了',RECOVERY_REQUIRED:'復旧が必要',CANCELLED:'キャンセル',SCANNING:'検索の保存地点',SCAN_FAILED:'検索失敗',READY:'検索完了・実行待ち',RUNNING:'実行中または結果確認待ち',FAILED:'失敗・結果確認が必要'};if(map[value])return map[value];for(const [key,label]of Object.entries(operations))if(value===key+' OK')return label+'完了';return value||'記録';}
  function verificationText(value){try{const v=JSON.parse(value);if(v.kind==='MESSAGES')return '対象 延べ'+v.total+'件 / 処理済み '+v.completed+'件 / 未処理 '+v.remaining+'件 / 結果不明 '+v.uncertain+'件';if('CREATE'in v)return (v.scope==='SELECTED'?'選択適用 / ':'')+['CREATE','REPLACE','DELETE','NOOP','ERROR'].map(k=>operations[k]+' '+(v[k]||0)+'件').join(' / ');if('before'in v&&'after'in v)return 'ラベル名: '+(v.before||'未作成')+' → '+v.after;if('unresolved'in v)return '未解決 '+v.unresolved+'件 / 選択外の差分 '+(v.remaining||0)+'件 / Gmail側のみ '+v.remoteOnly+'件';}catch(_){}if(/^completed=\d+$/.test(value))return '処理済み（変更なしを含む）'+value.split('=')[1]+'件';return value;}
  async function history(start=0,runId=''){
    const result=await rpc('history',{offset:start,runId});shell('実行ログ','実行日時・処理結果・エラーを新しい順に表示します。','history');if(runId)main.append(node('p','この実行のログを表示しています。実行ID: '+runId,'notice info'));const actions=node('div',null,'actions');add(actions,button('ログを更新',()=>history(start,runId)),button('操作に戻る',()=>showHome()));if(runId)actions.append(button('すべてのログ',()=>history(),'tertiary'));main.append(actions);
    if(!result.items.length)main.append(node('p','実行ログはまだありません。','empty'));
    for(const item of result.items){const card=node('article',null,'history-card'),tags=node('div',null,'tags');add(tags,node('span',commands[item.Command]||item.Command,'tag'),node('strong',resultText(item.Result)));card.append(tags,node('p',item.TimestampTokyo||item.at||'','muted'));if(item.Error)card.append(node('p',item.Error,'notice error'));if(item.Verification)card.append(node('p',verificationText(item.Verification)));const detail=node('details',null,'details'),dl=node('dl',null,'history-details');for(const [key,label]of [['RunId','実行ID'],['RuleKey','対象キー'],['SnapshotId','バックアップID'],['Actor','実行者'],['Risk','注意事項']])if(item[key])add(dl,node('dt',label),node('dd',item[key]));add(detail,node('summary','詳細'),dl);card.append(detail);main.append(card);}
    if(result.total>20){const pager=node('div',null,'pagination');if(start>0)pager.append(button('前の20件',()=>history(start-20,runId)));pager.append(node('p',(start+1)+'〜'+Math.min(start+20,result.total)+' / '+result.total+'件','count'));if(start+20<result.total)pager.append(button('次の20件',()=>history(start+20,runId)));main.append(pager);}if(runId)await acknowledge(runId);
  }
  for(const b of document.querySelectorAll('[data-page]'))b.addEventListener('click',action(()=>b.dataset.page==='home'?showHome():history()));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){session.resume();if(activeFilterView)rawRpc('filterJobStatus',{runId:activeFilterView}).then(renderFilterJob).catch(()=>{});}});
  window.addEventListener('pageshow',event=>{if(event.persisted)session.resume();});
  // Operations are visible before any service call. Bootstrap reads only saved outcome state.
  showHome(false);
  const restoredRequest=session.restore();
  rpc('boot').then(async result=>{if(result.filterJob)savedFilterJob=result.filterJob;if(result.filterPreparation)savedPreparation=result.filterPreparation;if(!savedMessageJob&&result.messageJob)savedMessageJob=result.messageJob;if(restoredRequest||interruptedRequest)return;if(savedFilterJob&&['ACCEPTED','RUNNING','WAITING'].includes(savedFilterJob.status)&&!userStarted){renderFilterJob(savedFilterJob);return;}if(savedFilterJob&&session.viewLocator()?.action!=='prepareRemaining'&&session.viewLocator()?.runId===savedFilterJob.runId&&!userStarted){session.forgetView();currentView=null;renderFilterJob(savedFilterJob);return;}if(session.viewLocator()&&!userStarted){await loadSavedView(session.viewLocator());return;}if(savedPreparation&&['PREPARING','READY'].includes(savedPreparation.status)&&!preparationBelongsToJob(savedPreparation,savedFilterJob)&&preparationFollowsJob(savedPreparation,savedFilterJob)&&!userStarted){await loadPreparation(savedPreparation.preparationId);return;}if(savedFilterJob&&!userStarted){renderFilterJob(savedFilterJob);return;}if(savedMessageJob&&!userStarted)showHome(false);if(!result.unseenOutcome)return;if(!userStarted){renderOutcome(result.unseenOutcome);if(result.unseenOutcome.status!=='UNKNOWN')await acknowledge(result.unseenOutcome.runId);}else{const notice=$('notice');notice.replaceChildren(node('p','前回の適用結果が残っています。'),button('前回の結果を確認',async()=>{renderOutcome(result.unseenOutcome);if(result.unseenOutcome.status!=='UNKNOWN')await acknowledge(result.unseenOutcome.runId);}));notice.hidden=false;}}).catch(()=>{if(!userStarted)message('接続状況を確認できませんでした。操作時に再確認します。','warning');});
})();
