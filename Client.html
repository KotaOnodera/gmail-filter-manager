<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),main=$('main');
  const homeContent=[...main.childNodes].map(n=>n.cloneNode(true));
  const operations={CREATE:'追加',REPLACE:'更新',DELETE:'削除',NOOP:'変更なし',ERROR:'入力エラー',REMOTE_ONLY:'Gmail側のみ'};
  const commands={IMPORT:'インポート',PREVIEW:'差分確認',APPLY:'フィルター適用',VERIFY:'適用後の検証',RECOVER:'復旧',LABEL_APPLY:'ラベル反映',LABEL_RECOVER:'ラベル復旧',WEB_SAVE:'旧画面での保存',MESSAGES:'既存メールの整理'};
  let working=false,userStarted=false,mode='ALL',preview=null,labels=[],selected=new Set(),pendingApplyRunId='',pendingMessageRunId='',savedMessageJob=null,savedFilterJob=null,savedPreparation=null,filterPoll=null,preparationPoll=null,activePreparationView='',activeFilterView='';
  let viewEpoch=0,currentView=null,selectionRevision=0,confirmationSource=null;
  let stickyCleanup=()=>{};
  let configurationNavigation=null,listNeedsRefresh=false,configurationGuards=[];
  function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined&&text!==null)el.textContent=String(text);if(cls)el.className=cls;return el;}
  function add(parent,...children){children.filter(Boolean).forEach(child=>parent.append(child));return parent;}
  function button(text,fn,style='secondary'){const b=node('button',text,'button '+style);b.type='button';b.addEventListener('click',action(fn));return b;}
  // One real action/control tree serves both pointer and keyboard users. Stages
  // supply only their summary; Session and confirmation guards retain ownership.
  function stickyActions(summary,primary,approval=null){
    stickyCleanup();
    const bar=node('section',null,'sticky-actions'),content=node('div',null,'sticky-action-content'),count=node('p','','selection-count'),spacer=node('div',null,'sticky-action-spacer'),root=document.documentElement;
    bar.id='next-action';bar.setAttribute('tabindex','-1');bar.setAttribute('aria-label','選択件数と次の操作');spacer.setAttribute('aria-hidden','true');
    count.setAttribute('role','status');count.setAttribute('aria-live','polite');count.setAttribute('aria-atomic','true');
    add(content,count,approval,primary);bar.append(content);add(main,spacer,bar);
    const nav=document.querySelectorAll('nav')[0],viewport=window.visualViewport;
    function measure(){
      const inset=viewport?Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop):0;
      const navHeight=window.innerWidth<=767&&!inset&&nav?nav.getBoundingClientRect().height:0;
      bar.style.setProperty('bottom',(inset+navHeight)+'px');
      bar.style.setProperty('--action-viewport-height',(viewport?.height||window.innerHeight)+'px');
      root.style.setProperty('--sticky-action-space',Math.ceil(bar.getBoundingClientRect().height+navHeight+inset)+'px');
    }

    observer?.observe(bar);if(nav)observer?.observe(nav);
    window.addEventListener('resize',measure);viewport?.addEventListener('resize',measure);viewport?.addEventListener('scroll',measure);
    stickyCleanup=()=>{observer?.disconnect();window.removeEventListener('resize',measure);viewport?.removeEventListener('resize',measure);viewport?.removeEventListener('scroll',measure);root.style.removeProperty('--sticky-action-space');stickyCleanup=()=>{};};
    const update=()=>{count.textContent=summary();measure();};update();return {update};
  }
  function nextActionLink(){const link=node('a','次の操作へ移動','next-action-link');link.href='#next-action';return link;}
  function targetCount(entries,keys=null){
    const chosen=keys?entries.filter(e=>keys.has(e.ruleKey||e.key)):entries;
    const labelCount=chosen.filter(e=>e.kind==='LABEL').length;
    return (keys?'選択 '+keys.size:'対象 '+chosen.length)+'件 / フィルター '+(chosen.length-labelCount)+'件 / ラベル '+labelCount+'件';
  }
  function confirmationAllowed(c){return c.kind==='webApproval'?!!c.p.entries?.length&&!c.p.summary?.ERROR&&!c.p.entries.some(e=>e.operation==='ERROR'||e.errors?.length):c.kind==='webMessageApproval'?c.p.remaining>0&&!c.p.entries?.some(e=>e.errors?.length):true;}
  function gateConfirmation(c){c.apply.disabled=working||!c.valid||!confirmationAllowed(c)||!!c.check&&!c.check.checked;if(c.check)c.check.disabled=working||!c.valid||!confirmationAllowed(c);}
  function setConfigurationNavigation(nav){
    if(!nav||!/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[-_a-zA-Z0-9]+\/edit$/.test(nav.spreadsheet||''))return;
    const sheets={};for(const name of ['Filters','Labels'])if(typeof nav.sheets?.[name]==='string'&&nav.sheets[name].startsWith(nav.spreadsheet+'#gid=')&&/^\d+$/.test(nav.sheets[name].slice((nav.spreadsheet+'#gid=').length)))sheets[name]=nav.sheets[name];
    configurationNavigation={spreadsheet:nav.spreadsheet,sheets};
  }
  function configurationLink(name=null,url=null){
    const nav=configurationNavigation;if(!nav)return null;const base=nav.sheets[name]||nav.spreadsheet;
    const rowPrefix=base+'&range=A';
    const safe=url===base||nav.sheets[name]&&typeof url==='string'&&url.startsWith(rowPrefix)&&/^[1-9]\d*$/.test(url.slice(rowPrefix.length));
    const link=node('a',name?name+'で設定を確認・修正（新しいタブ）':'設定スプレッドシートを開く（新しいタブ）','configuration-link');link.href=safe?url:base;link.target='_blank';link.rel='noopener noreferrer';
    link.addEventListener('click',()=>{
      listNeedsRefresh=true;configurationGuards.forEach(fn=>fn());
      if(activeConfirmation){activeConfirmation.needsReconfirm=true;freezeConfirmation(activeConfirmation);updateConfirmation(activeConfirmation,activeConfirmation.status);}
      message('設定を確認・編集した後は、差分または対象一覧を再取得し、内容を再確認してから適用してください。選択と現在の画面は保持しています。','info');
    });return link;
  }
  function configurationHelp(){
    if(!configurationNavigation)return null;
    const help=node('aside',null,'configuration-help');add(help,configurationLink(),node('p','編集後は一覧を再取得して再確認してください。行リンクは取得時点の位置です。並べ替え後は対象キーも確認してください。','muted'));return help;
  }
  function clearMessage(){for(const id of ['notice','error']){$(id).hidden=true;$(id).replaceChildren();}}
  function message(text,type='success'){const el=type==='error'?$('error'):$('notice');el.replaceChildren(node('p',text));el.hidden=false;el.className='notice '+(type==='error'?'error':type==='warning'?'warning':type==='info'?'info':'');if(type==='error')el.focus();}
  let disabledControls=[],interruptedRequest=null,recoveryView=null,recoveryPoll=null,recoveryRead=0;
  function setBusy(value){
    working=value;$('busy').hidden=!value;
    if(value){main.setAttribute('aria-busy','true');disabledControls=[...document.querySelectorAll('button,input,select,textarea')].map(el=>[el,el.disabled]);disabledControls.forEach(([el])=>el.disabled=true);}
    else{main.removeAttribute('aria-busy');disabledControls.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled;});disabledControls=[];configurationGuards.forEach(fn=>fn());if(activeConfirmation)gateConfirmation(activeConfirmation);}
  }
  function getStorage(){try{return window.sessionStorage;}catch(_){return undefined;}}
  const session=GFMClientSession.create({request:rawRpc,onBusy:setBusy,storage:getStorage(),isVisible:()=>!document.hidden,
    onError:err=>{if(pendingMessageRunId)showMessageUnknown(pendingMessageRunId,err);else if(pendingApplyRunId)showUnknown(pendingApplyRunId,err);else message(err?.message||'通信に失敗しました。実行ログを確認してください。','error');},
    onRecoveredResponse:()=>{interruptedRequest=null;clearTimeout(recoveryPoll);recoveryRead++;},
    onRecover:req=>{viewEpoch++;userStarted=true;pendingApplyRunId='';pendingMessageRunId='';preview=null;interruptedRequest=req;recoverRequest(req);}
  });
  function action(fn){return event=>{if(event?.preventDefault)event.preventDefault();if(working)return;viewEpoch++;recoveryRead++;userStarted=true;clearMessage();return session.run(()=>fn(event));};}
  function rawRpc(command,input={}){
    if(window.GFM_LOCAL)return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,input})}).then(r=>r.json()).then(r=>{if(r.error)throw new Error(r.error);return r.data;});
    return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).GFM_web(command,input));
  }
  function rpc(command,input={}){return session.call(command,input);}
  function readWithDeadline(command,input){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('状況確認がタイムアウトしました。再確認できます。')),10000);rawRpc(command,input).then(v=>{clearTimeout(timer);resolve(v);},e=>{clearTimeout(timer);reject(e);});});}
  function rememberView(view){if(view){currentView=view;session.remember(view);}}
  let activeConfirmation=null,confirmationTimer=null,confirmationPoll=null,confirmationRead=0;
  function forgetConfirmation(){clearTimeout(confirmationTimer);clearTimeout(confirmationPoll);activeConfirmation=null;confirmationRead++;}
  function freezeConfirmation(c){c.valid=false;if(c.check){c.check.checked=false;c.check.disabled=true;}c.apply.disabled=true;}
  function updateConfirmation(c,status){
    if(activeConfirmation!==c)return;
    if(c.needsReconfirm)status={...status,valid:false,message:'設定画面を開きました。内容を再確認して、新しい確認にチェックしてください。'};
    status={...status,expiresAt:status?.expiresAt??c.status?.expiresAt??c.p.confirmation?.expiresAt};c.status=status;c.valid=!!status?.valid&&!document.hidden;
    const deadline=Number.isFinite(status?.expiresAt)?new Date(status.expiresAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false})+'（日本時間）':'確認できません';
    c.text.textContent='有効期限: '+deadline+' / '+(status?.message||(c.valid?'有効':'確認が必要です。内容を再確認してください。'));
    c.text.className='notice '+(c.valid?'info':'warning');
    gateConfirmation(c);
    clearTimeout(confirmationTimer);clearTimeout(confirmationPoll);
    if(c.valid){
      // Use server remaining duration, never compare expiry against the device's clock.
      confirmationTimer=setTimeout(()=>{if(activeConfirmation===c){freezeConfirmation(c);c.text.textContent='有効期限をサーバーで再確認しています。';if(!document.hidden)refreshConfirmation(c);}},Math.max(0,status.expiresAt-status.serverNow));
      confirmationPoll=setTimeout(()=>{if(!document.hidden&&activeConfirmation===c)refreshConfirmation(c);},60000);
    }
  }
  async function refreshConfirmation(c=activeConfirmation,manual=false){
    if(!c||working&&!manual)return;const epoch=viewEpoch,sequence=++confirmationRead;freezeConfirmation(c);c.text.textContent='有効期限と最新の設定をサーバーで確認しています。';
    try{const status=!c.p.token&&c.p.preparationId?(await readWithDeadline('prepareStatus',{preparationId:c.p.preparationId})).confirmation:await readWithDeadline('confirmationStatus',{kind:c.kind,token:c.p.token});if(activeConfirmation===c&&epoch===viewEpoch&&sequence===confirmationRead)updateConfirmation(c,status);}
    catch(e){if(activeConfirmation===c&&epoch===viewEpoch&&sequence===confirmationRead){c.text.textContent='確認状態を取得できませんでした。「確認状態を更新」または「内容を再確認」を選んでください。';}}
  }
  async function approvedRequest(command,input){
    const c=activeConfirmation;
    try{return await rpc(command,input);}
    catch(e){
      if(c===activeConfirmation&&/確認.*期限|確認.*失効|確認後に|定義.*変更|別の確認|承認準備/.test(e.message||'')){
        pendingApplyRunId='';pendingMessageRunId='';freezeConfirmation(c);await refreshConfirmation(c,true);message(e.message,'warning');return null;
      }
      throw e;
    }
  }
  async function reconfirmContent(c){
    const view=c.p._view||currentView;
    if(!view){if(c.kind==='webImport')return importCheck();if(c.kind==='webMessageApproval')return prepareMessages(c.p.runId);return loadPreview(c.p.selection?'SELECTED':mode);}
    const fresh=await rpc('reconfirm',view);
    if(fresh.status==='MESSAGE_JOB'){renderMessageStatus(fresh.result);return;}
    renderSavedView(fresh);

  }
  function confirmationControls(p,kind,apply,check=null){
    const text=node('p','','notice info'),c={p,kind,apply,check,text,valid:false};activeConfirmation=c;
    if(check)check.addEventListener('change',()=>gateConfirmation(c));
    add(main,text,button('内容を再確認',()=>reconfirmContent(c)),button('確認状態を更新',()=>refreshConfirmation(c,true),'tertiary'));
    updateConfirmation(c,p.confirmation||{valid:false,message:'有効期限を確認してください。'});
  }
  function saveSelection(){
    if(!currentView)return;const epoch=viewEpoch;
    rawRpc('viewUpdate',{...currentView,_viewMode:mode,keys:[...selected],revision:++selectionRevision}).then(r=>{if(epoch===viewEpoch&&r.status!=='OK'&&r.status!=='STALE')message('選択内容を保存できませんでした。再読み込み前に保存済み画面を確認してください。','warning');}).catch(()=>{if(epoch===viewEpoch)message('選択内容を保存できませんでした。選択し直して再保存できます。','warning');});
  }
  function retrySavedView(action,error,view=null){
    shell('保存した画面を再確認','保存期限・設定変更・通信状態を確認してください。');main.append(node('p',error||'保存した表示が見つからないか、確認が失効しています。','notice warning'));
    const retry=action==='importCheck'?importCheck:action==='messagesList'?messagesList:action==='messagesPrepare'&&savedMessageJob?()=>prepareMessages(savedMessageJob.runId):action==='messagesStatus'&&view?()=>loadSavedView(view):()=>loadPreview(mode);
    add(main,button('取得し直す',retry,''),button('操作に戻る',()=>showHome(),'tertiary'));
  }
  function reconfirmationNotices(changes){
    const notices=[];if(changes)for(const [field,label]of [['missing','消失した対象'],['invalid','適用できなくなった対象'],['changed','変更された対象・依存ラベル']])if(changes[field]?.length)notices.push(node('p',label+': '+changes[field].join('、'),'notice warning'));return notices;
  }
  function renderSavedView(saved){
    if(saved.status==='JOB'){session.forgetView();currentView=null;renderFilterJob(saved.result);return;}
    if(saved.status!=='OK'&&!(saved.status==='INVALID'&&saved.result?.confirmation&&(['importCheck','messagesPrepare','prepare'].includes(saved.action)||saved.result.status==='READY'))){
      if(['prepare','prepareStart','prepareRemaining'].includes(saved.action))mode=saved.mode==='ALL'?'ALL':'SELECTED';
      retrySavedView(saved.action,saved.error);
      if(saved.status==='INVALID'&&saved.viewId&&saved.result){const c={p:{_view:saved},kind:'webApproval'};main.append(button('内容を再確認',()=>reconfirmContent(c)));}return;}
    if(['prepare','prepareStart','prepareRemaining'].includes(saved.action))confirmationSource=saved.sourceView||null;
    setConfigurationNavigation(saved.result?.navigation);listNeedsRefresh=false;mode=saved.mode||'ALL';selected=new Set(saved.keys||[]);selectionRevision=saved.revision||0;rememberView(saved.result?._view||saved);const r=saved.result;
    if(saved.action==='preview'){preview=r;labels=r.labels||[];renderPreview();}
    else if(['prepareStart','prepareRemaining'].includes(saved.action))renderPreparation(r);
    else if(saved.action==='prepare')renderConfirmation(r);
    else if(saved.action==='importCheck')renderImportCheck(r);
    else if(saved.action==='messagesList')renderMessagesList(r);
    else if(saved.action==='messagesPrepare')renderMessagesConfirmation(r);
    const changes=saved.changes||r.reconfirmation;if(changes&&!(['prepareStart','prepareRemaining','prepare'].includes(saved.action)&&['READY','BLOCKED','NOOP'].includes(r.status))){const content=[...main.childNodes];main.replaceChildren(...content.slice(0,2),...reconfirmationNotices(changes),...content.slice(2));}
  }
  async function loadSavedView(view){
    const epoch=viewEpoch;
    try{if(view.action==='messagesStatus'){const result=await readWithDeadline('messagesStatus',{runId:view.runId});if(epoch===viewEpoch)renderMessageStatus(result);return;}
      const saved=await readWithDeadline('viewGet',view);if(epoch===viewEpoch)renderSavedView(saved);}
    catch(e){if(epoch===viewEpoch)retrySavedView(view.action,e.message,view);}
  }
  async function recoverRequest(req){
    const sequence=++recoveryRead;clearTimeout(recoveryPoll);
    if(!session.isRecovery(req))return;
    if(!req.requestId){session.finish(req);interruptedRequest=null;showHome();message('画面を復元しました。必要な操作を選び直してください。','info');return;}
    if(recoveryView?.req!==req||!recoveryView.text.isConnected){
      clearMessage();shell('実行状況を確認','画面を離れても、開始済み処理の結果を保存済み状態から確認できます。変更処理を自動再送しません。');
      const text=node('p','保存済みの状況を取得しています。','notice info'),count=node('p','','selection-count'),refresh=node('button','状況を更新','button secondary');refresh.type='button';refresh.addEventListener('click',()=>recoverRequest(req));
      const actions=node('div',null,'actions');add(actions,refresh,button('操作に戻る',()=>showHome(),'tertiary'));add(main,text,count,actions);
      recoveryView={req,text,count,refresh,misses:0};
    }
    const view=recoveryView;view.refresh.disabled=true;
    try{
      const status=await readWithDeadline('resume',{requestId:req.requestId});
      if(!session.isRecovery(req)||sequence!==recoveryRead)return;
      if(status.messageJob){savedMessageJob=status.messageJob;view.count.textContent=messageCountText(status.messageJob);}
      if(status.status==='RUNNING'){
        view.text.textContent=status.action==='messagesScan'?'検索リクエストの完了を確認しています。最後の保存状況を表示しています。メールはまだ変更していません。':'サーバーで処理中です。この画面を表示し続ける必要はありません。戻ったときに状況を確認します。';
        recoveryPoll=setTimeout(()=>{if(!document.hidden&&session.isRecovery(req))recoverRequest(req);},3000);return;
      }
      if(status.status==='NOT_FOUND'){
        view.text.textContent='この操作の受付・結果をまだ確認できません。自動再実行はしません。「状況を更新」か実行ログで確認してください。';
        if(++view.misses<5)recoveryPoll=setTimeout(()=>{if(!document.hidden&&session.isRecovery(req))recoverRequest(req);},3000);return;
      }
      if(status.status==='UNKNOWN'&&status.action==='messagesScan'){
        view.text.textContent='検索リクエストの完了を確認できません。表示件数は最後の保存状況です。「状況を更新」で受付・結果を確認してください。検索もメール変更も自動再送しません。';return;
      }
      if(status.status==='DONE'&&status.viewId){
        const saved=await readWithDeadline('viewGet',{viewId:status.viewId,runId:status.runId});if(!session.isRecovery(req)||sequence!==recoveryRead)return;
        session.finish(req);interruptedRequest=null;renderSavedView(saved);return;
      }
      if(status.preparationId){session.finish(req);interruptedRequest=null;await loadPreparation(status.preparationId);return;}
      if(status.action?.startsWith('messages')&&status.runId&&status.messageJob){
        const full=await readWithDeadline('messagesStatus',{runId:status.runId});if(!session.isRecovery(req)||sequence!==recoveryRead)return;
        session.finish(req);interruptedRequest=null;renderMessageStatus(full);return;
      }
      session.finish(req);interruptedRequest=null;
      if(status.action==='apply'&&status.result){renderOutcome(status.result);if(status.result.status!=='UNKNOWN')rawRpc('acknowledgeOutcome',{runId:status.result.runId}).catch(()=>{});return;}
      if(status.status==='UNKNOWN'&&status.action==='apply'&&(status.runId||req.runId)){showUnknown(status.runId||req.runId,Error('処理結果が未確定です。実行ログを確認してください。'));return;}
      if(status.status==='DONE'&&status.action==='import'&&status.result){const r=status.result;shell('インポート完了','フィルター'+r.count+'件・ラベル'+(r.labelCount||0)+'件を追加しました。');add(main,button('この実行のログ',()=>history(0,r.runId)),button('操作に戻る',()=>showHome()));return;}
      showHome();message(status.status==='DONE'?'処理の完了を確認しました。必要な差分・確認画面は取得し直してください。':status.error||'処理結果が未確定です。実行ログを確認してから操作してください。',status.status==='DONE'?'info':'warning');
    }catch(err){if(session.isRecovery(req)&&sequence===recoveryRead)view.text.textContent=err.message+' 変更処理は再送していません。';}
    finally{if(view.refresh.isConnected&&sequence===recoveryRead)view.refresh.disabled=false;}
  }
  function navigation(page){document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
  function shell(title,lead,page='home'){stickyCleanup();forgetConfirmation();clearTimeout(filterPoll);clearTimeout(preparationPoll);activeFilterView='';activePreparationView='';configurationGuards=[];main.replaceChildren(node('h1',title),node('p',lead,'lead'));add(main,configurationHelp());navigation(page);main.focus();window.scrollTo(0,0);}
  function showHome(focus=true){stickyCleanup();forgetConfirmation();clearTimeout(filterPoll);clearTimeout(preparationPoll);activeFilterView='';activePreparationView='';
    configurationGuards=[];main.replaceChildren(...homeContent.map(n=>n.cloneNode(true)));add(main,configurationHelp());navigation('home');
    const handlers={import:importCheck,all:()=>loadPreview('ALL'),selected:()=>loadPreview('SELECTED'),history:()=>history(),messages:messagesList};
    for(const b of main.querySelectorAll('[data-command]'))b.addEventListener('click',action(handlers[b.dataset.command]));
    if(interruptedRequest)main.append(button('中断した操作の状況を確認',()=>session.resume(interruptedRequest)));
    if(savedFilterJob)main.append(button('保存済みのフィルター適用状況を確認',()=>loadFilterJob(savedFilterJob.runId)));
    if(savedPreparation)main.append(button('保存済みの適用確認を開く',()=>loadPreparation(savedPreparation.preparationId)));
    if(session.viewLocator())main.append(button('保存済みの確認画面を開く',()=>loadSavedView(session.viewLocator())));
    if(savedMessageJob)main.append(button('保存済みの既存メール処理を確認',()=>loadMessageStatus(savedMessageJob.runId)));
    if(focus){main.focus();window.scrollTo(0,0);}
  }
  function stats(summary){const grid=node('div',null,'summary-grid');for(const k of ['CREATE','REPLACE','DELETE']){const box=node('div',null,'stat');add(box,node('strong',summary[k]||0),node('span',operations[k]));grid.append(box);}return grid;}
  function candidates(entries){return entries.filter(e=>!['NOOP','REMOTE_ONLY'].includes(e.operation)||(e.operation==='NOOP'&&e.matchedId));}
  function titleOf(e){if(e.kind==='LABEL')return e.after?.name||e.before?.name||'ラベル';return e.after?.criteria?.from||e.before?.criteria?.from||e.after?.criteria?.subject||e.before?.criteria?.subject||e.after?.criteria?.query||e.before?.criteria?.query||'フィルターの変更';}
  function filterDefinition(filter){
    const dl=node('dl',null,'definition');if(!filter){dl.append(node('dd','設定なし'));return dl;}if(!filter.criteria&&!filter.action&&'name'in filter){add(dl,node('dt','ラベル名'),node('dd',filter.name));return dl;}

      if(selectable){const label=node('label',null,'selection-label'),check=node('input');check.type='checkbox';check.disabled=!e.eligible||!!e.errors.length;check.checked=selected.has(e.key);check.dataset.ruleKey=e.key;add(label,check,node('span','このフィルターを選択'));check.addEventListener('change',()=>{if(check.checked)selected.add(e.key);else selected.delete(e.key);onSelection();});card.append(label);}
      if(e.count!==undefined)card.append(node('p','一致したメール '+e.count+'件','tag'));
      card.append(node('p',messageActionText(e.action||{}),'notice info'));
      if(e.ignored?.length)card.append(node('p','既存メールには実行しません: '+e.ignored.join(' / '),'notice warning'));
      if(e.errors?.length)add(card,configurationLink('Filters',e.configurationUrl),node('p','Filters / RuleKey: '+(e.key||'キーなし'),'muted'),node('p',e.errors.join(' / '),'notice error'));
      if(e.filter){const detail=node('details',null,'details');add(detail,node('summary','検索条件と実行する処理'),filterDefinition({criteria:e.filter.criteria,action:e.action}));card.append(detail);}
      wrap.append(card);
    }return wrap;
  }
  async function messagesList(){
    if(savedMessageJob&&!['OK','CANCELLED'].includes(savedMessageJob.status)){await loadMessageStatus(savedMessageJob.runId);return;}
    const view=await rpc('messagesList');listNeedsRefresh=false;selected=new Set();selectionRevision=0;renderMessagesList(view);
  }
  function renderMessagesList(view){rememberView(view._view);setConfigurationNavigation(view.navigation);labels=view.labels||[];
    shell('既存メールへ適用するフィルター','受信済みのメールを整理します。フィルター設定の反映とは別の操作です。');
    main.append(node('p','ラベル付与・アーカイブ・既読化のみを実行します。検索開始時より前のメールが対象です。迷惑メール・ゴミ箱・下書き・送信済みは除外します。','notice info'));
    if(!view.entries.length)main.append(node('p','有効なフィルターがありません。','empty'));
    const next=button('選択したフィルターのメールを検索',()=>startMessages([...selected]),'');
    const update=()=>{next.disabled=working||listNeedsRefresh||selected.size===0;};let panel,sticky,hiddenCount=0;
    panel=listPanel(view.entries,messageCards(view.entries,true,()=>{panel.update();update();saveSelection();}),{selectable:true,keyOf:e=>e.key,eligible:e=>e.eligible&&!e.errors?.length,onSelection:update,onUpdate:({hidden})=>{hiddenCount=hidden;sticky?.update();}});update();
    const all=button('適用できる全件のメールを検索',()=>startMessages(null),'');const updateAll=()=>{update();all.disabled=working||listNeedsRefresh||view.entries.some(e=>e.errors.length)||!view.entries.some(e=>e.eligible);};configurationGuards.push(updateAll);updateAll();
    if(view.entries.some(e=>e.errors.length))main.append(node('p','入力エラーがあるため全件のメール検索はできません。設定を修正して取得し直すか、正しい対象を選択してください。','notice warning'));
    add(main,all,node('h2','選択して適用'),panel.element,button('対象一覧を再取得',messagesList),button('操作に戻る',()=>showHome(),'tertiary'));sticky=stickyActions(()=>targetCount(view.entries,selected)+' / 非表示 '+hiddenCount+'件',next);
  }

  async function startMessages(keys){if(listNeedsRefresh)throw Error('設定編集後は対象一覧を再取得・再確認してください');const run=await rpc('messagesStart',{keys});await scanMessages(run);}
  async function scanMessages(run){
    renderMessageStatus(run,true);pendingMessageRunId=run.runId;renderMessageStatus(await rpc('messagesScan',{runId:run.runId}));
  }
  function messageCountText(result){
    const scanning=result.totalKnown===false||['SCANNING','SCAN_FAILED'].includes(result.status);
    return (scanning?'検索済み':'対象')+' 延べ'+result.total+'件 / 処理済み '+result.completed+'件 / '+(scanning?'検索済みの未処理':'未処理')+' '+result.remaining+'件 / 結果不明 '+(result.uncertain||0)+'件'+(scanning?'（総対象件数は未確定）':'');
  }
  async function loadMessageStatus(runId){renderMessageStatus(await rpc('messagesStatus',{runId}));}
  function renderMessageStatus(result,requestPending=false){
    pendingMessageRunId='';savedMessageJob=result;labels=result.labels||labels;
    // Message progress is already persisted; remember only its status route and RunId.
    rememberView({viewId:'',action:'messagesStatus',runId:result.runId});
    shell('既存メールの処理状況','メール単位で処理します。同じメールが複数のフィルターに一致した場合は延べ件数として数えます。');
    const scanning=['SCANNING','SCAN_FAILED'].includes(result.status),done=result.status==='OK';
    if(done)main.append(node('p','既存メールへの適用が完了しました。','notice'));
    else if(requestPending)main.append(node('p','検索リクエストの応答を待っています。このバッチを検索しています。メールはまだ変更していません。','notice info'));
    else if(result.status==='SCAN_FAILED')main.append(node('p','対象メールの検索に失敗しました。原因を確認し、「検索を再試行」で保存済みの対象から続行してください。メールはまだ変更していません。','notice error'));
    else if(scanning)main.append(node('p','ここまで検索済み・続行待ちです。「対象メールの検索を続ける」で次のバッチへ進んでください。待つだけでは進みません。メールはまだ変更していません。','notice info'));
    else if(result.status==='CANCELLED')main.append(node('p','処理を中止しました。処理済みの変更は維持されます。','notice warning'));
    else main.append(node('p',result.status==='READY'?'検索が完了しました。対象件数と処理内容を確認してから実行してください。':'処理の続行には、もう一度内容を確認してください。','notice info'));
    main.append(node('p',messageCountText(result),'selection-count'));
    if(scanning)main.append(node('p','件数は保存済みのメールIDをフィルターごとに数えた累計です。同じメールが複数定義に一致すると重複して数えます。全体の完了率は検索完了まで確定しません。','muted'));
    if(result.uncertain)main.append(node('p','結果不明 '+result.uncertain+'件（未処理件数に含みます）。続行時は保存済みの同じメールへ再適用します。ラベルは重複しません。','notice warning'));
    if(result.error)main.append(node('p',result.error,'notice error'));
    const actions=node('div',null,'actions');
    if(requestPending){main.append(messageCards(result.entries||[]),node('p','実行ID: '+result.runId,'count'));return;}
    if(scanning)actions.append(button(result.status==='SCAN_FAILED'?'検索を再試行':'対象メールの検索を続ける',()=>scanMessages(result),''));
    else if(!done&&result.status!=='CANCELLED')actions.append(button('既存メールへの適用を確認',()=>prepareMessages(result.runId),''));
    add(actions,button('保存済みの状況を更新',()=>loadMessageStatus(result.runId)),button('この実行のログ',()=>history(0,result.runId)));
    if(!done&&result.status!=='CANCELLED')actions.append(button('残りの処理を中止する',async()=>{
      shell('既存メール処理の中止を確認','処理済みのメールは元に戻りません。残りの処理を中止します。');
      add(main,button('残りの処理を中止する',async()=>renderMessageStatus(await rpc('messagesCancel',{runId:result.runId})),''),button('状況に戻る',()=>loadMessageStatus(result.runId)));
    },'tertiary'));
    add(main,actions,messageCards(result.entries||[]),node('p','実行ID: '+result.runId,'count'),button('操作に戻る',()=>showHome(),'tertiary'));
  }
  async function prepareMessages(runId){
    renderMessagesConfirmation(await rpc('messagesPrepare',{runId}));
  }
  function renderMessagesConfirmation(p){setConfigurationNavigation(p.navigation);const runId=p.runId;rememberView(p._view);labels=p.labels||labels;
    shell('既存メールへの適用を確認','保存済みの対象メールへ、以下の3種類の処理だけを実行します。最終承認までの有効期限を確認してください。');
    main.append(node('p','対象 延べ'+p.total+'件 / 処理済み '+p.completed+'件 / 未処理 '+p.remaining+'件','selection-count'));
    if(p.uncertain)main.append(node('p','結果不明 '+p.uncertain+'件は、保存済みの同じメールへ再適用します。','notice warning'));
    main.append(nextActionLink(),messageCards(p.entries));const label=node('label',null,'check-confirm'),check=node('input');check.type='checkbox';add(label,check,node('span','既存メールの変更内容と対象外の処理を確認しました'));
    const apply=button('確認した既存メールを処理する',async()=>{if(!activeConfirmation?.valid||!confirmationAllowed(activeConfirmation)||!check.checked)throw Error('既存メールの変更内容を確認してください');pendingMessageRunId=runId;const result=await approvedRequest('messagesApply',{token:p.token});if(result)renderMessageStatus(result);},'');
    apply.disabled=true;
    add(main,node('p','大量の対象は小分けに処理します。途中で画面を閉じても、操作画面から保存済みの状況を確認できます。','muted'),button('状況に戻る',()=>loadMessageStatus(runId),'tertiary'));confirmationControls(p,'webMessageApproval',apply,check);stickyActions(()=>'対象 延べ'+p.total+'件 / 未処理 '+p.remaining+'件',apply,label);
  }
  function showMessageUnknown(runId,error){
    pendingMessageRunId='';shell('既存メールの結果を確認してください','通信が途切れました。処理は進んでいる可能性があります。保存済みの状況を確認してください。');
    if(error?.message)main.append(node('p',error.message,'notice warning'));
    add(main,button('保存済みの既存メール処理を確認',()=>loadMessageStatus(runId),''),button('この実行のログ',()=>history(0,runId)),node('p','実行ID: '+runId,'count'));
  }
  function resultText(value){const map={OK:'完了',START:'開始',SAVED:'保存済み',CREATED:'作成済み',ERROR:'エラー',PARTIAL:'一部完了',RECOVERY_REQUIRED:'復旧が必要',CANCELLED:'キャンセル',SCANNING:'検索の保存地点',SCAN_FAILED:'検索失敗',READY:'検索完了・実行待ち',RUNNING:'実行中または結果確認待ち',FAILED:'失敗・結果確認が必要'};if(map[value])return map[value];for(const [key,label]of Object.entries(operations))if(value===key+' OK')return label+'完了';return value||'記録';}
  function verificationText(value){try{const v=JSON.parse(value);if(v.kind==='MESSAGES')return '対象 延べ'+v.total+'件 / 処理済み '+v.completed+'件 / 未処理 '+v.remaining+'件 / 結果不明 '+v.uncertain+'件';if('CREATE'in v)return (v.scope==='SELECTED'?'選択適用 / ':'')+['CREATE','REPLACE','DELETE','NOOP','ERROR'].map(k=>operations[k]+' '+(v[k]||0)+'件').join(' / ');if('before'in v&&'after'in v)return 'ラベル名: '+(v.before||'未作成')+' → '+v.after;if('unresolved'in v)return '未解決 '+v.unresolved+'件 / 選択外の差分 '+(v.remaining||0)+'件 / Gmail側のみ '+v.remoteOnly+'件';}catch(_){}if(/^completed=\d+$/.test(value))return '処理済み（変更なしを含む）'+value.split('=')[1]+'件';return value;}
  async function history(start=0,runId=''){
    const result=await rpc('history',{offset:start,runId});shell('実行ログ','実行日時・処理結果・エラーを新しい順に表示します。','history');if(runId)main.append(node('p','この実行のログを表示しています。実行ID: '+runId,'notice info'));const actions=node('div',null,'actions');add(actions,button('ログを更新',()=>history(start,runId)),button('操作に戻る',()=>showHome()));if(runId)actions.append(button('すべてのログ',()=>history(),'tertiary'));main.append(actions);
    if(!result.items.length)main.append(node('p','実行ログはまだありません。','empty'));
    for(const item of result.items){const card=node('article',null,'history-card'),tags=node('div',null,'tags');add(tags,node('span',commands[item.Command]||item.Command,'tag'),node('strong',resultText(item.Result)));card.append(tags,node('p',item.TimestampTokyo||item.at||'','muted'));if(item.Error)card.append(node('p',item.Error,'notice error'));if(item.Verification)card.append(node('p',verificationText(item.Verification)));const detail=node('details',null,'details'),dl=node('dl',null,'history-details');for(const [key,label]of [['RunId','実行ID'],['RuleKey','対象キー'],['SnapshotId','バックアップID'],['Actor','実行者'],['Risk','注意事項']])if(item[key])add(dl,node('dt',label),node('dd',item[key]));add(detail,node('summary','詳細'),dl);card.append(detail);main.append(card);}
    if(result.total>20){const pager=node('div',null,'pagination');if(start>0)pager.append(button('前の20件',()=>history(start-20,runId)));pager.append(node('p',(start+1)+'〜'+Math.min(start+20,result.total)+' / '+result.total+'件','count'));if(start+20<result.total)pager.append(button('次の20件',()=>history(start+20,runId)));main.append(pager);}if(runId)await acknowledge(runId);
  }
  for(const b of document.querySelectorAll('[data-page]'))b.addEventListener('click',action(()=>b.dataset.page==='home'?showHome():history()));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){confirmationRead++;if(activeConfirmation)freezeConfirmation(activeConfirmation);}else{session.resume();refreshConfirmation();refreshPreparation().catch(()=>{});refreshFilterJob().catch(()=>{});}});
  window.addEventListener('pageshow',event=>{if(event.persisted){session.resume();refreshConfirmation();refreshPreparation().catch(()=>{});refreshFilterJob().catch(()=>{});}});
  // Operations are visible before any service call. Bootstrap reads only saved outcome state.
  showHome(false);
  const restoredRequest=session.restore();
  rpc('boot').then(async result=>{setConfigurationNavigation(result.navigation);if(result.navigation&&!userStarted&&!restoredRequest&&!session.viewLocator())showHome(false);if(result.filterJob)savedFilterJob=result.filterJob;if(result.filterPreparation)savedPreparation=result.filterPreparation;if(!savedMessageJob&&result.messageJob)savedMessageJob=result.messageJob;if(restoredRequest||interruptedRequest)return;if(savedFilterJob&&['ACCEPTED','RUNNING','WAITING'].includes(savedFilterJob.status)&&!userStarted){renderFilterJob(savedFilterJob);return;}if(savedFilterJob&&session.viewLocator()?.action!=='prepareRemaining'&&session.viewLocator()?.runId===savedFilterJob.runId&&!userStarted){session.forgetView();currentView=null;renderFilterJob(savedFilterJob);return;}if(session.viewLocator()&&!userStarted){await loadSavedView(session.viewLocator());return;}if(savedPreparation&&['PREPARING','READY','BLOCKED','NOOP','PAUSED'].includes(savedPreparation.status)&&!preparationBelongsToJob(savedPreparation,savedFilterJob)&&preparationFollowsJob(savedPreparation,savedFilterJob)&&!userStarted){if(savedPreparation._view)await loadSavedView(savedPreparation._view);else await loadPreparation(savedPreparation.preparationId);return;}if(savedFilterJob&&!userStarted){renderFilterJob(savedFilterJob);return;}if(savedMessageJob&&!userStarted)showHome(false);if(!result.unseenOutcome)return;if(!userStarted){renderOutcome(result.unseenOutcome);if(result.unseenOutcome.status!=='UNKNOWN')await acknowledge(result.unseenOutcome.runId);}else{const notice=$('notice');notice.replaceChildren(node('p','前回の適用結果が残っています。'),button('前回の結果を確認',async()=>{renderOutcome(result.unseenOutcome);if(result.unseenOutcome.status!=='UNKNOWN')await acknowledge(result.unseenOutcome.runId);}));notice.hidden=false;}}).catch(()=>{if(!userStarted)message('接続状況を確認できませんでした。操作時に再確認します。','warning');});
})();
