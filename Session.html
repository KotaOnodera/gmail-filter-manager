<script>
/* A suspended request can finish on the server. Detaching its UI never resends it. */
var GFMClientSession=(function(){
  'use strict';
  function create(d){
    const key='gfm.pendingRequest.v1',tracked=new Set(['reconfirm','importCheck','import','preview','prepare','prepareStart','prepareRemaining','apply','messagesList','messagesStart','messagesScan','messagesPrepare','messagesApply','messagesCancel']);
    const readable=new Set(['reconfirm','importCheck','preview','prepare','prepareStart','prepareRemaining','messagesList','messagesPrepare']);
    const viewKey='gfm.savedView.v1';
    function remember(view){if(!view||typeof view.viewId!=='string')return;try{d.storage?.setItem(viewKey,JSON.stringify({viewId:view.viewId,runId:view.runId||'',action:view.action||''}));}catch(_){}}
    function viewLocator(){try{const v=JSON.parse(d.storage?.getItem(viewKey)||'null');return v&&typeof v.viewId==='string'&&v.viewId.length<=128?v:null;}catch(_){return null;}}
    let active=null,recovery=null,returning=null,serial=0;
    const stale=()=>new Error('画面を復元したため、古い応答は使用しません');
    function save(req){try{d.storage?.setItem(key,JSON.stringify(req));}catch(_){/* Storage may be disabled in an embedded browser. */}}
    function clear(req){try{const old=JSON.parse(d.storage?.getItem(key)||'null');if(old?.requestId===req.requestId)d.storage.removeItem(key);}catch(_){}}
    function resume(request){
      const req=active?.request||request||recovery;if(!req)return false;
      if(active?.timer)clearTimeout(active.timer);returning=active&&readable.has(req.command)?active:returning;active=null;recovery=req;d.onBusy(false);d.onRecover(req);return true;
    }
    async function run(fn){
      if(active)return;
      const ctx={request:null,timer:null};active=ctx;recovery=null;returning=null;d.onBusy(true);
      try{return await fn();}catch(err){if(active===ctx)d.onError(err);}
      finally{if(active===ctx){if(ctx.timer)clearTimeout(ctx.timer);active=null;d.onBusy(false);}}
    }
    async function call(command,input={}){
      const ctx=active,shouldTrack=ctx&&tracked.has(command);
      const req={requestId:shouldTrack?Date.now().toString(36)+'-'+(++serial)+'-'+Math.random().toString(36).slice(2):'',command,runId:typeof input.runId==='string'?input.runId:''};
      if(ctx){ctx.request=req;if(ctx.timer)clearTimeout(ctx.timer);ctx.timer=setTimeout(()=>{if(active===ctx&&ctx.request===req&&d.isVisible())resume();},45000);if(shouldTrack)save(req);}
      try{
        const result=await d.request(command,shouldTrack?{...input,_requestId:req.requestId}:input);
        if(ctx&&active!==ctx){if(returning!==ctx)throw stale();active=ctx;returning=null;recovery=null;d.onRecoveredResponse?.(req);}
        if(shouldTrack)clear(req);if(result?._view)remember(result._view);else if(result?.result?._view)remember(result.result._view);return result;
      }catch(err){if(ctx&&returning===ctx){returning=null;d.onRecover(req);}throw err;
      }finally{if(ctx&&ctx.request===req&&ctx.timer){clearTimeout(ctx.timer);ctx.timer=null;}}
    }
    function restore(){
      try{const req=JSON.parse(d.storage?.getItem(key)||'null');if(!req||!tracked.has(req.command)||typeof req.requestId!=='string'||!req.requestId||req.requestId.length>128)return false;recovery=req;d.onRecover(req);return true;}catch(_){return false;}
    }
    return {run,call,resume,restore,remember,viewLocator,forgetView:()=>{try{d.storage?.removeItem(viewKey);}catch(_){}},isRecovery:req=>recovery===req&&!active,waitingResponse:req=>recovery===req&&!!returning,finish:req=>{if(recovery===req){clear(req);recovery=null;returning=null;}}};
  }
  return {create};
})();
</script>
